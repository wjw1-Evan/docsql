name: nuget-packages

# NuGet 包发布:推送 v* tag(或手动)时打包并推送四个 .NET 包到 GitHub Packages。
# 前置:docker-image.yml 的测试门禁在 main 上已跑;本流水线只做 pack + push。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch embedded native libraries (Releases)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # release-binaries runs in parallel on the same tag: wait for its
          # five native assets before packing. A managed-only package would
          # silently break "dotnet add package → Data Source=app.db".
          for i in $(seq 1 60); do
            have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '[.assets[].name | select(startswith("docsql-native-"))] | length' \
              2>/dev/null || echo 0)
            if [ "$have" -ge 5 ]; then break; fi
            echo "waiting for native release assets ($have/5)…"
            sleep 30
          done
          rm -rf native && mkdir -p native
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'docsql-native-*' --dir native
          python3 - <<'PY'
          import glob, os, tarfile, zipfile

          # Rust target triple → .NET runtime identifier. The client's
          # DllImport resolver looks in runtimes/<rid>/native/, so the
          # payload must land under exactly these names.
          rids = {
              "x86_64-unknown-linux-gnu": "linux-x64",
              "aarch64-unknown-linux-gnu": "linux-arm64",
              "aarch64-apple-darwin": "osx-arm64",
              "x86_64-apple-darwin": "osx-x64",
              "x86_64-pc-windows-msvc": "win-x64",
          }
          dest_root = "dotnet/Docsql.Client/runtimes"
          packed = []
          for path in sorted(glob.glob("native/*")):
              name = os.path.basename(path)
              target = next(
                  (t for t in rids if name.endswith(f"-{t}.tar.gz") or name.endswith(f"-{t}.zip")),
                  None,
              )
              if target is None:
                  print(f"skip unrecognized asset: {name}")
                  continue
              out = os.path.join(dest_root, rids[target], "native")
              os.makedirs(out, exist_ok=True)
              if name.endswith(".zip"):
                  with zipfile.ZipFile(path) as z:
                      z.extractall(out)
              else:
                  with tarfile.open(path) as t:
                      t.extractall(out)
              packed.append(rids[target])
              print(f"packed {rids[target]}: {sorted(os.listdir(out))}")
          missing = sorted(set(rids.values()) - set(packed))
          if missing:
              raise SystemExit(f"missing native libraries for: {missing}")
          PY

      - name: Pack
        run: |
          dotnet pack dotnet/Docsql.Client/Docsql.Client.csproj -c Release -o out
          dotnet pack dotnet/Docsql.EntityFrameworkCore/Docsql.EntityFrameworkCore.csproj -c Release -o out
          dotnet pack dotnet/Docsql.Aspire.Client/Docsql.Aspire.Client.csproj -c Release -o out
          dotnet pack dotnet/Docsql.Aspire.Hosting/Docsql.Aspire.Hosting.csproj -c Release -o out

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source \
            --username wjw1-Evan \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/wjw1-Evan/index.json"
          # GitHub Packages intermittently answers 5xx/timeouts; a failed
          # push used to fail the whole release and need a manual re-run.
          # Retry each package with backoff; --skip-duplicate keeps re-runs
          # idempotent (409 on an already-pushed version is success).
          for pkg in out/*.nupkg; do
            name=$(basename "$pkg")
            ok=""
            for i in 1 2 3 4 5; do
              if dotnet nuget push "$pkg" --source github --skip-duplicate; then
                ok=1
                break
              fi
              echo "push $name failed (attempt $i); retrying in 20s"
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "::error::push $name failed after 5 attempts"
              exit 1
            fi
          done
