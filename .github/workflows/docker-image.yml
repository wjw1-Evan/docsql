# CI pipeline: test gate -> build & publish multi-arch image to GHCR ->
# run the compose multi-node deployment tests against the built image.
#
# Image: ghcr.io/<owner>/docsql  (repo owner lowercased)
# Triggers:
#   push to main  -> test + dotnet + publish (latest, main, sha-*) + deploy tests
#   tag v*        -> test + dotnet + publish (version, major.minor, sha-*)
#   pull request  -> test + dotnet + image build only (no push, amd64 only)
name: docker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Rapid pushes/PR updates: cancel the superseded run instead of racing full
# pipelines (and concurrent publishes to the same tags).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dotnet:
    name: dotnet test
    runs-on: ubuntu-latest
    # The Aspire sample consumes the four Docsql packages from GitHub
    # Packages: read access lets CI restore them with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The ADO.NET/EF test suites launch target/debug/docsql-server.
      - run: cargo build -p docsql-server
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test
        working-directory: dotnet
      # Aspire sample is intentionally outside Docsql.sln (real users consume
      # the published packages); still compile it here so API drift is caught.
      # Fork PRs cannot read the repo's private packages — skip there.
      - name: Authenticate GitHub Packages for the sample
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: >
          dotnet nuget update source github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile dotnet/samples/AspireSample/nuget.config
      - name: Build Aspire sample against published packages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # On a v* tag push the sample's package version is published by the
          # nuget-publish workflow in parallel; retry the restore briefly.
          for i in 1 2 3 4 5 6; do
            dotnet restore dotnet/samples/AspireSample/AspireSample.AppHost/AspireSample.AppHost.csproj && break
            echo "restore not ready yet (attempt $i); retrying in 30s"
            sleep 30
          done
          dotnet build dotnet/samples/AspireSample/AspireSample.AppHost/AspireSample.AppHost.csproj --no-restore

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Fails when workspace line/function coverage drops below the floors in
      # deploy/coverage.sh (a tuned -llvm-cov build; doubles as a test run).
      - run: ./deploy/coverage.sh

  build:
    name: build & publish image
    needs: [test, dotnet, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publish rights only where publishing happens — not on PR jobs.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase image names.
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The test gate already ran natively in the `test` job.
          build-args: |
            RUN_TESTS=false

  deploy-test:
    name: compose multi-node deployment tests
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      # Rebuild the amd64 image from the shared GHA cache (fast) and load it
      # locally; run-tests.sh picks it up via DOCSQL_DEV_IMAGE_TAG=ci.
      - name: Load image from cache
        run: >
          docker buildx build --platform linux/amd64 --build-arg RUN_TESTS=false
          --cache-from type=gha --load -t "${IMAGE}:ci" .
      - name: Run deployment tests
        run: DOCSQL_DEV_IMAGE_TAG=ci ./deploy/run-tests.sh
