<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocSQL 博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>DocSQL 博客</h1>
      <span class="badge" id="mode-badge">嵌入式</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="搜索标题或正文…" autocomplete="off">
      <button id="db-btn">数据库面板</button>
      <button id="compose-btn" class="primary">写文章</button>
    </div>
  </header>

  <main>
    <section class="list-pane">
      <div class="tagbar" id="tags"></div>
      <div id="posts" class="posts"></div>
      <p class="empty" id="empty" hidden>没有匹配的文章</p>
    </section>
    <aside class="detail-pane" id="detail">
      <div class="placeholder">
        <span class="ph-icon">📖</span>
        <p>选择一篇文章阅读与评论</p>
        <p class="hint">数据存在本机的一个 <code>blog.db</code> 文件里,没有 server、没有 Docker。</p>
      </div>
    </aside>
  </main>

  <dialog id="composer" class="composer">
    <form id="post-form" method="dialog">
      <h2>写文章</h2>
      <label>标题
        <input name="title" maxlength="200" required placeholder="一句话说清主题">
      </label>
      <div class="row">
        <label>作者
          <input name="author" list="author-list" maxlength="60" placeholder="alice">
          <datalist id="author-list"></datalist>
        </label>
        <label>标签(逗号分隔)
          <input name="tags" maxlength="200" placeholder="dotnet, embedded">
        </label>
      </div>
      <label>正文
        <textarea name="body" rows="7" placeholder="支持任意文本;缺字段、异形数据都没问题。"></textarea>
      </label>
      <p class="err" id="form-err"></p>
      <footer class="actions">
        <button type="button" id="cancel-compose">取消</button>
        <button class="primary" type="submit">发布</button>
      </footer>
    </form>
  </dialog>

  <dialog id="dbpanel" class="dbpanel">
    <div class="dbpanel-head">
      <h2>数据库面板</h2>
      <button id="db-close" class="primary">关闭</button>
    </div>
    <div class="dbpanel-body">
      <section>
        <h3>数据库状态</h3>
        <div id="db-status" class="db-status">加载中…</div>
      </section>

      <section>
        <h3>写路径演示(真实执行)</h3>
        <div class="lab-actions" id="lab-actions">
          <button data-action="refresh-matview">REFRESH 物化视图</button>
          <button data-action="merge-stats">MERGE 作者统计</button>
          <button data-action="tx-savepoint">事务 + SAVEPOINT</button>
          <button data-action="trigger-fire">触发器演示</button>
        </div>
        <div class="sub-row">
          <input id="sub-email" type="email" placeholder="邮箱 — 订阅(auto-GUID,引擎生成 UUIDv7)">
          <button id="sub-btn">订阅</button>
        </div>
        <pre id="lab-action-result" class="lab-result" hidden></pre>
      </section>

      <section>
        <h3>功能面板 — 只读演示批(每项附原文 SQL 与结果)</h3>
        <div id="lab" class="lab">加载中…</div>
      </section>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
