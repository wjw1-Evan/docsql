<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="description" content="DocSQL console">
<title>DocSQL Studio — 管理控制台</title>
<style>
  /* ============ DocSQL Studio(SSMS 风格)============ */
  :root {
    --chrome: #f0f0f0; --chrome2: #f7f7f7; --border: #d4d4d4; --border2: #e4e4e4;
    --accent: #0072c6; --accent-dk: #005a9e;
    --tree-sel: #cce4f7; --tree-hover: #e8f2fc; --tree-sel-bd: #99d1ff;
    --grid-hd: #f5f6f7; --grid-bd: #dcdfe3; --grid-hover: #f0f7fd;
    --err: #e81123; --ok: #107c10; --warn: #ff8c00;
    --txt: #1a1a1a; --txt2: #555; --txt3: #888;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --ui: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --sql-kw: #0000c0; --sql-str: #a31515; --sql-num: #800000; --sql-cm: #008000; --sql-fn: #c7254e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font: 12px/1.5 var(--ui); color: var(--txt); background: var(--chrome);
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button, input, select, textarea { font: inherit; }
  button {
    background: linear-gradient(#fdfdfd, #f0f0f0); border: 1px solid var(--border);
    border-radius: 3px; padding: 3px 10px; cursor: pointer; color: var(--txt);
  }
  button:hover { background: linear-gradient(#f0f7fd, #e4f0fb); border-color: #a6d3f0; }
  button:active { background: #dceefa; }
  button:disabled { color: #aaa; border-color: var(--border2); background: #f5f5f5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent-dk); color: #fff; }
  button.primary:hover { background: #1a86d4; }
  button.danger { color: var(--err); }
  input[type=text], textarea, select {
    border: 1px solid var(--border); border-radius: 2px; padding: 3px 6px; background: #fff;
    -webkit-user-select: text; user-select: text;
  }
  input[type=text]:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* ---------- 菜单栏 ---------- */
  #menubar {
    display: flex; align-items: center; height: 28px; background: var(--chrome);
    border-bottom: 1px solid var(--border); padding: 0 6px; flex: none;
  }
  #menubar .brand { font-weight: 600; color: var(--accent-dk); margin-right: 10px; }
  #menubar .brand small { color: var(--txt3); font-weight: 400; }
  .menu { position: relative; }
  .menu > span { display: inline-block; padding: 4px 10px; border-radius: 2px; cursor: default; }
  .menu > span:hover, .menu.open > span { background: var(--tree-sel); }
  .menu-drop {
    display: none; position: absolute; top: 100%; left: 0; min-width: 190px; z-index: 300;
    background: #fff; border: 1px solid var(--border); box-shadow: 0 3px 10px rgba(0,0,0,.18);
    padding: 3px 0;
  }
  .menu.open .menu-drop { display: block; }
  .menu-drop div { padding: 4px 22px 4px 26px; cursor: default; white-space: nowrap; }
  .menu-drop div:hover { background: var(--tree-sel); }
  .menu-drop hr { border: 0; border-top: 1px solid var(--border2); margin: 3px 0; }
  .menu-drop .kbd { float: right; color: var(--txt3); margin-left: 24px; }

  /* ---------- 工具栏 ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px;
    background: var(--chrome2); border-bottom: 1px solid var(--border); flex: none;
  }
  #toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  #toolbar .spacer { flex: 1; }
  #token { width: 150px; }
  .tb-ico { display: inline-flex; vertical-align: -3px; margin-right: 4px; }

  /* ---------- 主区域 ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #explorer {
    width: 268px; min-width: 180px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex: none;
  }
  .panel-title {
    background: var(--chrome); border-bottom: 1px solid var(--border); padding: 5px 10px;
    font-weight: 600; color: var(--txt2); display: flex; align-items: center; gap: 6px;
    flex: none;
  }
  .panel-title .mini { margin-left: auto; display: flex; gap: 2px; }
  .panel-title .mini button { padding: 1px 6px; font-size: 12px; }
  #tree { flex: 1; overflow: auto; padding: 4px 0 12px; -webkit-user-select: none; user-select: none; }
  .tnode { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 0;
           white-space: nowrap; cursor: default; }
  .tnode:hover { background: var(--tree-hover); }
  .tnode.sel { background: var(--tree-sel); outline: 1px dotted var(--tree-sel-bd); }
  .tnode .twist { width: 14px; flex: none; text-align: center; color: var(--txt3);
                  font-size: 9px; cursor: pointer; }
  .tnode .tico { width: 17px; flex: none; display: inline-flex; }
  .tnode .tlabel { overflow: hidden; text-overflow: ellipsis; }
  .tnode .tlabel .cnt { color: var(--txt3); }
  .tnode .badge { font-size: 10px; color: var(--accent-dk); border: 1px solid #b8d7f0;
                  border-radius: 6px; padding: 0 4px; margin-left: 4px; background: #eef6fd; }
  .tnode .badge.obs { color: #5f7d3a; border-color: #d3e3c0; background: #f2f8ea; }
  .tnode .badge.pk { color: #6a4fa3; border-color: #ddd0ee; background: #f4effc; }
  .tnode .tlabel .obs-col { color: var(--txt3); }
  .tnode .ttl-flag { color: var(--warn); margin-left: 3px; font-size: 11px; }
  .tchildren { padding-left: 15px; }
  .tchildren.collapsed { display: none; }

  /* ---------- 文档区 ---------- */
  #docarea { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  #tabstrip {
    display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--border);
    overflow-x: auto; flex: none; min-height: 27px;
  }
  .tab {
    display: flex; align-items: center; gap: 5px; padding: 4px 8px 4px 12px; cursor: default;
    border-right: 1px solid var(--border2); white-space: nowrap; color: var(--txt2);
  }
  .tab.active { background: #fff; color: var(--txt); box-shadow: inset 0 2px 0 var(--accent); }
  .tab .x { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 2px; color: var(--txt3); font-size: 12px; }
  .tab .x:hover { background: #ffd7d4; color: var(--err); }
  #tabcontent { flex: 1; min-height: 0; position: relative; }
  .doc { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  .doc.active { display: flex; }
  .doc-bar {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--chrome2);
    border-bottom: 1px solid var(--border2); flex: none; flex-wrap: wrap;
  }
  .doc-bar .title { font-weight: 600; color: var(--txt2); margin-right: 6px; }
  .doc-bar .meta { color: var(--txt3); }
  .doc-bar .spacer { flex: 1; }
  /* 日志页类别切换按钮(doc-bar 内的 segmented control) */
  .doc-bar .catbtn.on { background: var(--accent); border-color: var(--accent-dk); color: #fff; }

  /* ---------- 查询编辑器 ---------- */
  .q-wrap { flex: 1; display: flex; flex-direction: column; min-height: 120px; }
  .editor { flex: 1.2; display: flex; min-height: 90px; background: #fff; overflow: hidden;
            border-bottom: 2px solid var(--border); }
  .gutter {
    flex: none; width: 44px; background: var(--chrome); border-right: 1px solid var(--border2);
    overflow: hidden; text-align: right; padding: 6px 6px 6px 0;
    font: 12.5px/1.55 var(--mono); color: var(--txt3); user-select: none;
  }
  .edit-scroll { position: relative; flex: 1; overflow: hidden; }
  .hl, .src {
    position: absolute; inset: 0; margin: 0; padding: 6px 8px;
    font: 12.5px/1.55 var(--mono); white-space: pre; overflow: auto;
    tab-size: 2;
  }
  .hl { pointer-events: none; z-index: 1; color: var(--txt); }
  .src {
    z-index: 2; background: transparent; color: transparent; caret-color: #000;
    border: 0; outline: 0; resize: none; -webkit-user-select: text; user-select: text;
  }
  .src::selection { background: #b4d7ff; color: transparent; }
  .k { color: var(--sql-kw); font-weight: 600; } .s { color: var(--sql-str); }
  .n { color: var(--sql-num); } .c { color: var(--sql-cm); font-style: italic; }
  .f { color: var(--sql-fn); }

  /* ---------- 结果区 ---------- */
  .res-wrap { flex: 1; display: flex; flex-direction: column; min-height: 60px; }
  .res-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--chrome2); flex: none; }
  .res-tab { padding: 4px 16px; cursor: default; color: var(--txt2); border: 1px solid transparent;
             border-bottom: 0; margin-bottom: -1px; }
  .res-tab.active { background: #fff; color: var(--txt); border-color: var(--border);
                    box-shadow: inset 0 2px 0 var(--accent); }
  .res-pane { flex: 1; overflow: auto; display: none; min-height: 0; }
  .res-pane.active { display: block; }
  .msg-list { font: 12px/1.7 var(--mono); padding: 6px 10px; -webkit-user-select: text; user-select: text; }
  .msg-list .m-err { color: var(--err); }
  .msg-list .m-ok { color: var(--ok); }
  .msg-list .m-info { color: var(--txt2); }

  /* ---------- 网格 ---------- */
  .grid-wrap { overflow: auto; }
  table.grid { border-collapse: collapse; font: 12px/1.5 var(--mono); -webkit-user-select: text; user-select: text; }
  .grid th, .grid td { border: 1px solid var(--grid-bd); padding: 2px 8px; text-align: left;
                       white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  .grid th { background: var(--grid-hd); position: sticky; top: 0; z-index: 2; cursor: pointer;
             font-family: var(--ui); font-weight: 600; color: var(--txt2); }
  .grid th .sort-ind { color: var(--accent); margin-left: 3px; }
  .grid td.rownum, .grid th.rownum { background: var(--grid-hd); color: var(--txt3); text-align: right;
                                      position: sticky; left: 0; z-index: 1; font-family: var(--ui); }
  .grid th.rownum { z-index: 3; cursor: default; }
  .grid tr.sel td { background: var(--tree-sel); }
  .grid td:hover { background: var(--grid-hover); }
  .grid .null { color: #b0b0b0; font-style: italic; }
  .grid-label { font-weight: 600; color: var(--txt2); padding: 6px 10px 2px; }

  /* ---------- 仪表盘 ---------- */
  .dash { overflow: auto; padding: 16px; }
  .dash h2 { margin: 0 0 4px; font-size: 18px; }
  .dash .sub { color: var(--txt3); margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; background: #fff;
          box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card .v { font-size: 24px; font-weight: 600; color: var(--accent-dk); }
  .card .v small { font-size: 12px; color: var(--txt3); font-weight: 400; }
  .card .k { color: var(--txt2); margin-top: 2px; }
  .dash-actions { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- 状态栏 ---------- */
  #statusbar {
    height: 24px; flex: none; background: var(--accent); color: #fff; display: flex;
    align-items: center; gap: 0; font-size: 11.5px;
  }
  #statusbar.busy { background: var(--warn); }
  #statusbar.err { background: var(--err); }
  #statusbar span { padding: 0 10px; border-right: 1px solid rgba(255,255,255,.25); }
  #statusbar .grow { flex: 1; border: 0; }

  /* ---------- 右键菜单 / 弹窗 / 提示 ---------- */
  #ctxmenu {
    display: none; position: fixed; z-index: 500; background: #fff; border: 1px solid var(--border);
    box-shadow: 0 3px 12px rgba(0,0,0,.2); padding: 3px 0; min-width: 180px;
  }
  #ctxmenu div { padding: 4px 24px 4px 28px; cursor: default; white-space: nowrap; }
  #ctxmenu div:hover { background: var(--tree-sel); }
  #ctxmenu hr { border: 0; border-top: 1px solid var(--border2); margin: 3px 0; }
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 600;
    align-items: center; justify-content: center;
  }
  .dialog { background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.25);
            min-width: 360px; max-width: 520px; border-radius: 4px; overflow: hidden; }
  .dialog h3 { margin: 0; padding: 9px 14px; background: var(--chrome); border-bottom: 1px solid var(--border);
               font-size: 13px; }
  .dialog .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .dialog .row { display: flex; align-items: center; gap: 8px; }
  .dialog .row label { width: 90px; color: var(--txt2); flex: none; }
  .dialog .row input { flex: 1; }
  .dialog .foot { padding: 10px 14px; border-top: 1px solid var(--border2); display: flex;
                  justify-content: flex-end; gap: 8px; background: var(--chrome2); }
  .dialog .err-line { color: var(--err); min-height: 16px; }
  /* 新建表:列编辑网格 */
  .dialog .hint { color: var(--txt3); line-height: 1.6; }
  table.colgrid { border-collapse: collapse; width: 100%; }
  .colgrid th, .colgrid td { border: 1px solid var(--border2); padding: 2px 5px; text-align: left; }
  .colgrid th { background: var(--grid-hd); color: var(--txt2); font-weight: 600; }
  .colgrid input[type=text] { width: 100%; border-color: transparent; background: transparent; }
  .colgrid input[type=text]:focus { border-color: var(--accent); background: #fff; }
  .colgrid input[type=checkbox], .colgrid select { vertical-align: middle; }
  .colgrid .delcol { border: 0; background: none; padding: 0 4px; color: var(--txt3); }
  .colgrid .delcol:hover { color: var(--err); }
  /* 插入文档:JSON 编辑域 */
  .dialog textarea.json-edit {
    width: 100%; min-height: 190px; resize: vertical;
    font: 12.5px/1.55 var(--mono); white-space: pre; tab-size: 2;
  }
  #toasts { position: fixed; right: 14px; bottom: 34px; z-index: 700; display: flex;
            flex-direction: column; gap: 6px; }
  .toast { background: #323130; color: #fff; border-radius: 4px; padding: 8px 14px; max-width: 380px;
           box-shadow: 0 3px 10px rgba(0,0,0,.3); animation: tin .18s ease-out; }
  .toast.err { background: var(--err); }
  @keyframes tin { from { opacity: 0; transform: translateY(6px); } }
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-thumb { background: #c8c8c8; border: 3px solid #fff; border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
</style>
</head>
<body>

<div id="menubar">
  <span class="brand">DocSQL <small>Studio</small></span>
  <div class="menu" data-menu><span>文件</span><div class="menu-drop">
    <div data-act="new-query">新建查询<span class="kbd">Ctrl+N</span></div>
    <div data-act="new-table">新建表…</div>
    <hr>
    <div data-act="close-tab">关闭当前文档</div>
  </div></div>
  <div class="menu" data-menu><span>视图</span><div class="menu-drop">
    <div data-act="refresh">刷新对象资源管理器<span class="kbd">Ctrl+R</span></div>
    <div data-act="dashboard">服务器仪表盘</div>
    <div data-act="cluster">集群状态</div>
    <div data-act="logs">日志</div>
  </div></div>
  <div class="menu" data-menu><span>帮助</span><div class="menu-drop">
    <div data-act="about">关于 DocSQL Studio</div>
  </div></div>
</div>

<div id="toolbar">
  <span title="连接状态" id="conn-dot" style="font-weight:700;color:#e81123">●</span>
  <input id="token" type="text" placeholder="令牌 X-Docsql-Token" title="服务器开启认证时填写令牌">
  <button id="btn-connect">连接</button>
  <div class="sep"></div>
  <span style="color:var(--txt2)">节点</span>
  <select id="nodesel" style="display:none;max-width:190px" title="切换管理的节点:默认节点(控制台启动时指定的管理目标)或 DOCSQL_PEERS 集群节点。控制台不存数据,所有操作以数据库客户端身份连接所选节点执行,认证使用服务端配置的 DOCSQL_TOKEN,● 在线 ○ 离线"></select>
  <div class="sep"></div>
  <button id="btn-newq" title="新建查询编辑器 (Ctrl+N)"><span class="tb-ico" data-ico="query"></span>新建查询</button>
  <button id="btn-exec" class="primary" title="执行 (F5)"><span class="tb-ico" data-ico="run"></span>执行</button>
  <button id="btn-parse" title="分析 (Ctrl+F5) — 仅语法检查,不执行">分析</button>
  <div class="sep"></div>
  <button id="btn-refresh" title="刷新对象资源管理器 (Ctrl+R)"><span class="tb-ico" data-ico="refresh"></span>刷新</button>
  <div class="spacer"></div>
  <span id="tb-server" class="meta" style="color:#888"></span>
</div>

<div id="main">
  <div id="explorer">
    <div class="panel-title">
      <span class="tb-ico" data-ico="explorer"></span>对象资源管理器
      <span class="mini">
        <button id="exp-newtable" title="新建表">＋表</button>
        <button id="exp-collapse" title="全部折叠">⊖</button>
      </span>
    </div>
    <div id="tree"></div>
  </div>
  <div id="docarea">
    <div id="tabstrip"></div>
    <div id="tabcontent"></div>
  </div>
</div>

<div id="statusbar">
  <span id="st-conn">未连接</span>
  <span id="st-server">DocSQL</span>
  <span id="st-last" style="display:none"></span>
  <span class="grow"></span>
  <span id="st-ready">就绪</span>
</div>

<div id="ctxmenu"></div>
<div id="overlay"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ================= 基础工具 ================= */
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 引用标识符转义:表名等进入 "..." 时,内嵌 " 必须加倍,否则注入/断句。
const qident = (s) => String(s).replace(/"/g, '""');
const fmtBytes = (n) => { if (!n) return '0 B'; const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const fmtDur = (ms) => { const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? `${d}天${h}时${m}分` : h ? `${h}时${m}分` : m ? `${m}分${s%60}秒` : `${s}秒`; };

/* ================= 图标(内联 SVG)================= */
const SVG = (inner, vb) => `<svg width="16" height="16" viewBox="${vb||'0 0 16 16'}" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const ICONS = {
  server: SVG(`<ellipse cx="8" cy="3.4" rx="5.6" ry="2.1" stroke="#4a7a54" stroke-width="1.1"/><path d="M2.4 3.4v9.2c0 1.16 2.5 2.1 5.6 2.1s5.6-.94 5.6-2.1V3.4" stroke="#4a7a54" stroke-width="1.1"/><path d="M2.4 8c0 1.16 2.5 2.1 5.6 2.1S13.6 9.16 13.6 8" stroke="#4a7a54" stroke-width="1.1"/>`),
  folder: SVG(`<path d="M1.5 4.2c0-.5.4-.9.9-.9h3l1.4 1.5h6.8c.5 0 .9.4.9.9v6.4c0 .5-.4.9-.9.9H2.4c-.5 0-.9-.4-.9-.9V4.2z" fill="#f5c26b" stroke="#c99b3f" stroke-width="1"/>`),
  folderOpen: SVG(`<path d="M1.5 4.2c0-.5.4-.9.9-.9h3l1.4 1.5h6.8c.5 0 .9.4.9.9V7H1.5V4.2z" fill="#f5c26b" stroke="#c99b3f" stroke-width="1"/><path d="M1 7.4h13.8l-1.7 5.4c-.1.4-.5.7-.9.7H2.3c-.4 0-.8-.3-.9-.7L1 7.4z" fill="#ffd98a" stroke="#c99b3f" stroke-width="1"/>`),
  table: SVG(`<rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="#cfe3f7" stroke="#5b8dbf" stroke-width="1"/><path d="M1.5 5.6h13M1.5 8.7h13M6 5.6v8" stroke="#5b8dbf" stroke-width=".9"/>`),
  column: SVG(`<rect x="4.5" y="2.5" width="7" height="11" rx="1" fill="#e8f0fb" stroke="#5b8dbf" stroke-width="1"/><path d="M4.5 5.5h7" stroke="#5b8dbf" stroke-width=".9"/>`),
  key: SVG(`<circle cx="5" cy="6" r="2.8" stroke="#c8a000" stroke-width="1.3" fill="#ffe9a8"/><path d="M7 8l5.4 5.4M10 11l1.8-1.8M11.5 12.5l1.8-1.8" stroke="#c8a000" stroke-width="1.3"/>`),
  index: SVG(`<path d="M2.5 4h11M2.5 8h8M2.5 12h5" stroke="#8a6db8" stroke-width="1.6" stroke-linecap="round"/>`),

/* ================= API 层 ================= */
const api = {
  token: localStorage.getItem('docsql.token') || '',
  // 当前管理的节点('' = 默认节点,即控制台启动时指定的管理目标;
  // 否则为 DOCSQL_PEERS 中的地址)。
  node: localStorage.getItem('docsql.node') || '',
  headers() { const h = {'Content-Type': 'application/json'}; if (this.token) h['X-Docsql-Token'] = this.token; return h; },
  async get(path) {
    if (this.node) path += (path.includes('?') ? '&' : '?') + 'node=' + encodeURIComponent(this.node);
    return this._do(fetch(path, {headers: this.headers()}));
  },
  async post(path, body) {
    body = body || {};
    if (this.node) body = Object.assign({node: this.node}, body);
    return this._do(fetch(path, {method: 'POST', headers: this.headers(), body: JSON.stringify(body)}));
  },
  async _do(p) {
    const r = await p;
    if (r.status === 401) { ui.connState('unauth'); throw new Error('未授权:请在工具栏填写正确的令牌'); }
    ui.connState('ok');
    return r.json();
  }
};

/* ================= UI 反馈 ================= */
const ui = {
  connState(state) {
    const dot = $('#conn-dot'), bar = $('#st-conn'), sb = $('#statusbar');
    if (state === 'ok') { dot.textContent = '●'; dot.style.color = '#107c10';
      bar.textContent = '已连接 ' + location.host; sb.className = ''; }
    else if (state === 'unauth') { dot.textContent = '●'; dot.style.color = '#e81123';
      bar.textContent = '未授权(令牌错误)'; sb.className = 'err'; }
    else { dot.textContent = '●'; dot.style.color = '#e81123'; bar.textContent = '未连接'; sb.className = ''; }
  },
  status(text, cls) {
    const sb = $('#statusbar');
    sb.className = cls || '';
    $('#st-last').style.display = text ? '' : 'none';
    if (text) $('#st-last').textContent = text;
    $('#st-ready').textContent = text ? '' : '就绪';
  },
  toast(msg, isErr) {
    const el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), isErr ? 5000 : 2600);
  }
};

/* ================= 节点切换 ================= */
// 管理节点选择器:默认管理节点 + DOCSQL_PEERS 中的集群节点。控制台是
// 管理工具、不存数据:'' 表示默认节点,显式选择则以 node 参数经控制台
// 后端用二进制协议连接该节点执行;选择会持久化,重启控制台后自动恢复。
const nodes = {
  known: [], // [{addr, reachable}] — 来自 /api/cluster 探测
  default: '', // 控制台后端配置的默认管理节点(/api/cluster 的 default)
  sel() { return $('#nodesel'); },
  // 用 /api/cluster 的探测结果刷新下拉框(● 在线 ○ 离线);保存的节点
  // 若已不在 DOCSQL_PEERS 中,自动回落到默认节点。
  sync(list) {
    if (!Array.isArray(list)) return;
    this.known = list.map(n => ({addr: n.addr, reachable: !!n.reachable}));
    const sel = this.sel();
    if (!this.known.length) { sel.style.display = 'none'; if (api.node) this.apply(''); return; }
    sel.style.display = '';
    // 集群页每 5s 轮询都会走到这里;内容没变就不重建 DOM,避免打断正在
    // 展开的下拉框。
    const def = this.default ? `默认节点 (${esc(this.default)})` : '默认节点';
    const html = `<option value="">${def}</option>` +
      this.known.map(n => `<option value="${esc(n.addr)}">${n.reachable ? '● ' : '○ '}${esc(n.addr)}</option>`).join('');
    if (sel.innerHTML !== html) sel.innerHTML = html;
    const cur = api.node;
    sel.value = this.known.some(n => n.addr === cur) ? cur : '';
    if (sel.value !== cur) this.apply('');
  },
  apply(addr) {
    if (api.node === addr) return;
    api.node = addr;
    localStorage.setItem('docsql.node', addr);
    $('#st-server').textContent = addr ? `节点 ${addr}` : (this.default ? `默认 ${this.default}` : 'DocSQL');
    explorer.refresh();
    // 已打开的仪表盘/数据页跟随切换到新目标节点。
    tabs.byKind('dash').forEach(t => t.load && t.load());
    tabs.byKind('data').forEach(t => t.load && t.load());
  },
  async boot() {
    try {
      const r = await api.get('/api/cluster');
      this.default = r.default || '';
      this.sync(r.nodes || []);
    }
    catch (e) { /* 首次探测失败(未授权/网络):选择器保持隐藏 */ }
  }
};
$('#nodesel').onchange = (e) => {
  const addr = e.target.value;
  nodes.apply(addr);
  ui.toast(addr ? `已切换到节点 ${addr},对象资源管理器已刷新` : `已切换到默认节点${nodes.default ? ` ${nodes.default}` : ''}`);
};

/* ================= 右键菜单 ================= */
const ctx = {
  open(items, x, y) {
    const m = $('#ctxmenu');
    m.innerHTML = items.map(it => it === '-' ? '<hr>' :
      `<div data-mi="${esc(it.id)}">${esc(it.label)}${it.kbd ? `<span class="kbd" style="float:right;color:#999;margin-left:22px">${esc(it.kbd)}</span>` : ''}</div>`).join('');
    m.style.display = 'block';
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(x, innerWidth - r.width - 6) + 'px';
    m.style.top = Math.min(y, innerHeight - r.height - 6) + 'px';
    m.onclick = (e) => { const t = e.target.closest('[data-mi]'); if (t) { ctx.close(); const it = items.find(i => i !== '-' && i.id === t.dataset.mi); if (it) it.act(); } };
  },
  close() { $('#ctxmenu').style.display = 'none'; }
};
document.addEventListener('click', () => ctx.close());
document.addEventListener('contextmenu', (e) => { if (!e.target.closest('#tree')) ctx.close(); });

/* ================= 弹窗表单 ================= */
function closeModal() { const ov = $('#overlay'); ov.style.display = 'none'; ov.innerHTML = ''; ov.onkeydown = null; }
function showModal(html, focusSel) {
  const ov = $('#overlay');
  ov.innerHTML = html;
  ov.style.display = 'flex';
  $('[data-cancel]', ov).onclick = closeModal;
  ov.onmousedown = (e) => { if (e.target === ov) closeModal(); };
  const f = focusSel && $(focusSel, ov); if (f) f.focus();
  return ov;
}
function dialog(title, fields, okText, onOk) {
  const ov = showModal(`<div class="dialog"><h3>${esc(title)}</h3><div class="body">` +
    fields.map(f => `<div class="row"><label>${esc(f.label)}</label><input type="text" data-f="${esc(f.name)}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}"></div>`).join('') +
    `<div class="err-line" data-err></div></div><div class="foot"><button data-cancel>取消</button><button class="primary" data-ok>${esc(okText)}</button></div></div>`,
    'input[data-f]');
  $('[data-ok]', ov).onclick = async () => {
    const vals = {};
    fields.forEach(f => { vals[f.name] = $(`input[data-f="${f.name}"]`, ov).value.trim(); });
    try { await onOk(vals, (m) => { $('[data-err]', ov).textContent = m || ''; });
      closeModal(); } catch (e) { /* handled */ }
  };
  ov.onkeydown = (e) => { if (e.key === 'Enter') $('[data-ok]', ov).click(); };
}

/* ---------- 新建表(mongo-express 式入口 + 列编辑网格)---------- */
const COL_TYPES = ['ANY', 'INT', 'TEXT', 'REAL', 'BOOLEAN', 'GUID'];
function newTableDialog() {
  const colRow = (c) => `<tr data-col>
    <td><input type="text" data-c="name" value="${esc(c.name || '')}" placeholder="列名"></td>
    <td><select data-c="type">${COL_TYPES.map(t => `<option${t === (c.type || 'ANY') ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
    <td><input type="text" data-c="dflt" value="${esc(c.dflt || '')}" placeholder="如 'abc'、7、true" title="DEFAULT:SQL 字面量,字符串需带单引号;留空表示无默认值"></td>
    <td style="text-align:center"><input type="checkbox" data-c="pk"${c.pk ? ' checked' : ''}></td>
    <td style="text-align:center"><input type="checkbox" data-c="nn"${c.nn ? ' checked' : ''}></td>
    <td style="text-align:center"><input type="checkbox" data-c="ai"${c.ai ? ' checked' : ''}></td>
    <td><button class="delcol" data-delcol title="删除此列">✕</button></td></tr>`;
  const ov = showModal(`<div class="dialog" style="min-width:640px;max-width:720px"><h3>新建表</h3><div class="body">
    <div class="row"><label>表名</label><input type="text" data-t="name" placeholder="如 users"></div>
    <div>
      <table class="colgrid"><thead><tr><th style="width:30%">列名</th><th style="width:16%">类型</th><th style="width:26%">默认值</th>
        <th title="主键">PK</th><th title="非空">NOT NULL</th><th title="自增">AUTO</th><th></th></tr></thead>
      <tbody data-cols>${colRow({name: 'id', type: 'INT', pk: true, nn: true})}${colRow({})}</tbody></table>
      <div style="margin-top:6px"><button data-addcol>+ 添加列</button></div>
    </div>
    <div class="hint">GUID + AUTO:主键自动生成时序有序 UUIDv7(INSERT 省略即可);INT + AUTO 为自增整数。其余类型仅作文档用途(无模式文档存储,类型不被强制);PK 不隐含 NOT NULL,勾选 PK 会自动勾上 NOT NULL。默认值填 SQL 字面量(字符串需带引号,如 'n/a';数字/布尔直接写),INSERT 省略该列时自动填入。</div>
    <div class="err-line" data-err></div></div>
    <div class="foot"><button data-cancel>取消</button><button class="primary" data-ok>创建</button></div></div>`,
    '[data-t="name"]');
  const readCols = () => $$('tr[data-col]', ov).map(tr => ({
    name: $('[data-c="name"]', tr).value.trim(),
    type: $('[data-c="type"]', tr).value,
    dflt: $('[data-c="dflt"]', tr).value.trim(),
    pk: $('[data-c="pk"]', tr).checked,
    nn: $('[data-c="nn"]', tr).checked,
    ai: $('[data-c="ai"]', tr).checked,
  }));
  $('[data-addcol]', ov).onclick = () => {
    $('[data-cols]', ov).insertAdjacentHTML('beforeend', colRow({}));
    const rows = $$('tr[data-col]', ov);
    $('input[data-c="name"]', rows[rows.length - 1]).focus();
  };
  ov.addEventListener('click', (e) => {
    const del = e.target.closest('[data-delcol]');
    if (del) { const tr = del.closest('tr'); tr.parentElement.removeChild(tr); }
  });
  // PK 隐含 NOT NULL 的联动(DocSQL 的 PK 不隐含 NOT NULL,这里替用户勾上,可手动取消)
  ov.addEventListener('change', (e) => {
    if (e.target.matches('[data-c="pk"]') && e.target.checked) {
      $('[data-c="nn"]', e.target.closest('tr')).checked = true;
    }
    if (e.target.matches('[data-c="ai"]') && e.target.checked) {
      // AUTO 的含义随类型:GUID → 时序 UUIDv7,INT → 自增整数;
      // 已选 GUID/INT 时保持不变,其余切到 INT。
      const sel = $('[data-c="type"]', e.target.closest('tr'));
      if (sel.value !== 'GUID' && sel.value !== 'INT') sel.value = 'INT';
    }
  });
  $('[data-ok]', ov).onclick = async () => {
    const err = (m) => { $('[data-err]', ov).textContent = m; };
    const name = $('[data-t="name"]', ov).value.trim();
    if (!name) return err('请输入表名');
    const cols = readCols();
    if (!cols.length) return err('至少需要一列');
    const names = new Set();
    for (const c of cols) {
      if (!c.name) return err('存在空列名');
      if (names.has(c.name)) return err(`列名重复:${c.name}`);
      names.add(c.name);
    }
    let sql = `CREATE TABLE "${qident(name)}" (\n` + cols.map(c => {
      let s = `  "${qident(c.name)}" ${c.type}`;
      if (c.pk) s += ' PRIMARY KEY';
      if (c.nn) s += ' NOT NULL';
      if (c.ai) s += ' AUTOINCREMENT';
      if (c.dflt) s += ` DEFAULT ${c.dflt}`;
      return s;
    }).join(',\n') + '\n);';
    ui.status(`正在创建表 ${name}…`, 'busy');
    let r;
    try { r = await api.post('/api/sql', {sql}); }
    catch (e) { ui.status('创建失败', 'err'); return err(e.message); }
    if (r.kind === 'error') { ui.status('创建失败', 'err'); return err(r.message); }
    ui.toast(`已创建表 ${name}`);
    explorer.refreshSoon();
    closeModal();
  };
  ov.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target.matches('input[type=text]')) $('[data-ok]', ov).click();
  };
}

/* ---------- 编辑表(与新建表同一列编辑网格;ALTER 落地) ---------- */
// 已有列:可改名(RENAME COLUMN)/删除(DROP COLUMN,主键列除外),类型、
// 约束与默认值锁定——引擎不支持在线改约束/类型(ALTER COLUMN SET DEFAULT
// 亦不支持),如需重建请另建表迁移。新增列支持类型 + DEFAULT + NOT NULL
// (ADD COLUMN 以默认值回填存量行;NOT NULL 必须带 DEFAULT),不支持
// PK/UNIQUE/自增。
function editTableDialog(tableName, meta, after) {
  if (!meta || !meta.columns) { ui.toast('没有表元数据,先刷新对象资源管理器', true); return; }
  const colRow = (c, orig) => {
    const ex = !!orig; // 已有列:锁定类型/约束/默认值,可改名/删除
    const lock = ex ? ' disabled title="已有列的类型/约束/默认值不可在线修改(引擎不支持 ALTER COLUMN SET DEFAULT;如需变更请重建表)"' : '';
    // 新增列:PK/自增在 ADD COLUMN 上不可用;NOT NULL 配默认值可用。
    const pkLock = ex ? lock : ' disabled title="ADD COLUMN 不支持主键"';
    const aiLock = ex ? lock : ' disabled title="ADD COLUMN 不支持自增"';
    const dfltPh = ex ? '' : ' placeholder="如 \'abc\'、7、true"';
    const delBtn = ex && c.pk
      ? '<button class="delcol" disabled title="主键列不能删除">✕</button>'
      : '<button class="delcol" data-delcol title="删除此列">✕</button>';
    return `<tr data-col${ex ? ` data-orig="${esc(orig)}"` : ''}>
    <td><input type="text" data-c="name" value="${esc(c.name || '')}" placeholder="列名"></td>
    <td><select data-c="type"${lock}>${COL_TYPES.map(t => `<option${t === (c.type || 'ANY') ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
    <td><input type="text" data-c="dflt" value="${esc(c.dflt || '')}"${ex ? ' disabled' : ''}${dfltPh} title="DEFAULT:SQL 字面量,字符串需带单引号;已有列的默认值不可在线修改"></td>
    <td style="text-align:center"><input type="checkbox" data-c="pk"${c.pk ? ' checked' : ''}${pkLock}></td>
    <td style="text-align:center"><input type="checkbox" data-c="nn"${c.nn ? ' checked' : ''}${lock}></td>
    <td style="text-align:center"><input type="checkbox" data-c="ai"${c.ai ? ' checked' : ''}${aiLock}></td>
    <td>${delBtn}</td></tr>`;
  };
  const rowsHTML = meta.columns.map(c => colRow({
    name: c.name, type: c.data_type || 'ANY', pk: c.primary_key,
    nn: !c.nullable, ai: c.autoinc, dflt: c.default || '',
  }, c.name)).join('');
  const ov = showModal(`<div class="dialog" style="min-width:640px;max-width:720px"><h3>编辑表 — ${esc(tableName)}</h3><div class="body">
    <div class="row"><label>表名</label><input type="text" value="${esc(tableName)}" disabled title="重命名表请使用 ALTER TABLE ... RENAME TO"></div>
    <div>
      <table class="colgrid"><thead><tr><th style="width:30%">列名</th><th style="width:16%">类型</th><th style="width:26%">默认值</th>
        <th title="主键">PK</th><th title="非空">NOT NULL</th><th title="自增">AUTO</th><th></th></tr></thead>
      <tbody data-cols>${rowsHTML}</tbody></table>
      <div style="margin-top:6px"><button data-addcol>+ 添加列</button></div>
    </div>
    <div class="hint">已有列可改名与删除(主键列除外),类型/约束/默认值不可在线修改;新增列支持类型 + 默认值 + NOT NULL(带默认值时自动回填存量行,NOT NULL 必须带默认值;ADD COLUMN 不支持 PK/UNIQUE/自增)。变更按「重命名 → 删除 → 新增」顺序执行,出错前的语句已生效。</div>
    <div class="err-line" data-err></div></div>
    <div class="foot"><button data-cancel>取消</button><button class="primary" data-ok>保存</button></div></div>`);
  $('[data-addcol]', ov).onclick = () => {
    $('[data-cols]', ov).insertAdjacentHTML('beforeend', colRow({}));
    const rows = $$('tr[data-col]', ov);
    $('input[data-c="name"]', rows[rows.length - 1]).focus();
  };
  ov.addEventListener('click', (e) => {
    const del = e.target.closest('button[data-delcol]');
    if (del) { const tr = del.closest('tr'); tr.parentElement.removeChild(tr); }
  });
  $('[data-ok]', ov).onclick = async () => {
    const err = (m) => { $('[data-err]', ov).textContent = m; };
    const cols = $$('tr[data-col]', ov).map(tr => ({
      name: $('[data-c="name"]', tr).value.trim(),
      type: $('[data-c="type"]', tr).value,
      dflt: $('[data-c="dflt"]', tr).value.trim(),
      nn: $('[data-c="nn"]', tr).checked,
      orig: tr.dataset.orig || null,
    }));
    if (cols.some(c => !c.name)) return err('存在空列名');
    const names = new Set();
    for (const c of cols) {
      if (names.has(c.name)) return err(`列名重复:${c.name}`);
      names.add(c.name);
    }
    const qt = `"${qident(tableName)}"`;
    const stmts = [];
    // 1) 改名(按原列名匹配)
    for (const c of cols) {
      if (c.orig && c.orig !== c.name)
        stmts.push(`ALTER TABLE ${qt} RENAME COLUMN "${qident(c.orig)}" TO "${qident(c.name)}"`);
    }
    // 2) 删除(原列不再出现在网格中;主键列在 UI 已禁删,服务端兜底报错)
    for (const o of meta.columns) {
      if (!cols.some(c => c.orig === o.name))
        stmts.push(`ALTER TABLE ${qt} DROP COLUMN "${qident(o.name)}"`);
    }
    // 3) 新增(类型 + 默认值 + NOT NULL;NN 必须带 DEFAULT,引擎以默认值回填存量行)
    for (const c of cols) {
      if (!c.orig) {
        if (c.nn && !c.dflt) return err(`新增 NOT NULL 列 ${c.name} 必须填默认值`);
        stmts.push(`ALTER TABLE ${qt} ADD COLUMN "${qident(c.name)}" ${c.type}${c.nn ? ' NOT NULL' : ''}${c.dflt ? ` DEFAULT ${c.dflt}` : ''}`);
      }
    }
    if (!stmts.length) return err('没有变更');
    ui.status(`正在更新表 ${tableName}…`, 'busy');
    let r;
    try { r = await api.post('/api/sql', {sql: stmts.join(';\n') + ';'}); }
    catch (e) { ui.status('保存失败', 'err'); return err(e.message); }
    if (r.kind === 'error') { ui.status('保存失败', 'err'); return err(r.message); }
    if (r.kind === 'batch' && r.error) {
      // 批次顺序执行,出错前的语句已生效——刷新树并指出失败语句。
      explorer.refreshSoon();
      if (after) after();
      ui.status('部分保存', 'err');
      return err(`第 ${r.error.statement + 1} 条失败:${r.error.message}(其前的语句已生效)`);
    }
    ui.toast(`已更新表 ${tableName}`);
    explorer.refreshSoon();
    if (after) after();
    closeModal();
  };
  ov.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target.matches('input[type=text]')) $('[data-ok]', ov).click();
  };
}

/* ---------- 插入文档(JSON → INSERT;对象单行,数组批量)---------- */
// JSON 值 → SQL 字面量:嵌套对象/数组以 JSON 文本字符串存储(DocSQL 文档式存储支持声明外字段)。
function sqlLiteral(v) {
  if (v === null) return 'NULL';
  const t = typeof v;
  if (t === 'number') return Number.isFinite(v) ? String(v) : 'NULL';
  if (t === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (t === 'string') return "'" + v.replace(/'/g, "''") + "'";
  return "'" + JSON.stringify(v).replace(/'/g, "''") + "'";
}

function insertDocDialog(tableName, meta, after) {
  const cols = meta && meta.columns ? meta.columns.filter(c => !c.autoinc) : [];
  const tpl = JSON.stringify(Object.fromEntries(cols.map(c => [c.name, c.primary_key || !c.nullable ? 1 : ''])), null, 2) || '{}';
  const ov = showModal(`<div class="dialog" style="min-width:540px;max-width:680px"><h3>插入文档 — ${esc(tableName)}</h3><div class="body">
    <div class="hint">输入 JSON 文档:对象插入一行,数组批量插入多行。允许包含未在表结构中声明的字段(文档式存储)。</div>
    <textarea class="json-edit" data-t="doc" spellcheck="false">${esc(tpl)}</textarea>
    <div class="err-line" data-err></div></div>
    <div class="foot"><span class="hint" style="margin-right:auto">Ctrl+Enter 插入</span><button data-cancel>取消</button><button class="primary" data-ok>插入</button></div></div>`,
    'textarea.json-edit');
  const submit = async () => {
    const err = (m) => { $('[data-err]', ov).textContent = m; };
    let doc;
    try { doc = JSON.parse($('textarea[data-t="doc"]', ov).value); }
    catch (e) { return err('JSON 解析失败:' + e.message); }
    const docs = Array.isArray(doc) ? doc : [doc];
    if (!docs.length) return err('数组为空');
    if (docs.some(d => !d || typeof d !== 'object' || Array.isArray(d))) return err('需要 JSON 对象(或对象数组)');
    const stmts = docs.map(d => {
      const ks = Object.keys(d);
      if (!ks.length) return null;
      return `INSERT INTO "${qident(tableName)}" (${ks.map(k => `"${qident(k)}"`).join(', ')}) VALUES (${ks.map(k => sqlLiteral(d[k])).join(', ')})`;
    });
    if (stmts.includes(null)) return err('存在空对象 {}');
    ui.status(`正在插入 ${docs.length} 行到 ${tableName}…`, 'busy');
    let r;
    try { r = await api.post('/api/sql', {sql: stmts.join(';\n') + ';'}); }
    catch (e) { ui.status('插入失败', 'err'); return err(e.message); }
    if (r.kind === 'error') { ui.status('插入失败', 'err'); return err(r.message); }
    if (r.kind === 'batch' && r.error) { ui.status('插入失败', 'err'); return err(`第 ${r.error.statement + 1} 条:${r.error.message}`); }
    ui.toast(`已插入 ${docs.length} 行到 ${tableName}`);
    explorer.refreshSoon();
    closeModal();
    if (after) after();
  };
  $('[data-ok]', ov).onclick = submit;
  ov.onkeydown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('textarea')) { e.preventDefault(); submit(); }
  };
}

/* ---------- 索引管理(引擎仅支持单列;修改 = 按新定义重建)---------- */
const indexCreateSql = (t, name, col, uniq) =>
  `CREATE ${uniq ? 'UNIQUE ' : ''}INDEX "${qident(name)}" ON "${qident(t)}" ("${qident(col)}")`;

function indexDef(tableName, indexName) {
  const m = explorer.tableMeta(tableName);
  return m && m.index_defs ? m.index_defs.find(d => d.name === indexName) : null;
}

// 约束自动索引只读脚本:引擎不接受对 sqlite_autoindex_* 的
// CREATE/DROP,脚本以注释说明来源,避免给出无法执行的 DDL。
function autoIndexScript(tableName, name, d) {
  const m = explorer.tableMeta(tableName);
  const pkCol = m && (m.columns.find(c => c.primary_key) || {}).name;
  const kind = d.column === pkCol ? 'PRIMARY KEY' : 'UNIQUE';
  openQueryTab(`脚本: ${name}`,
    `-- ${name}:由表 ${tableName} 的 ${kind} 约束自动创建(列 ${d.column})。\n` +
    `-- 随表定义创建与维护,不能单独创建、修改或删除;调整约束请编辑表定义。`);
}

// 索引名是库级命名空间(任一表占用即全库不可用)。
function indexNameTaken(name, exceptTable) {
  return ((explorer.meta && explorer.meta.tables) || [])
    .some(t => t.name !== exceptTable && (t.indexes || []).includes(name));
}

// UNIQUE 预检:与引擎口径一致(NULL 不算重复)。同名修改必须「先删旧再建新」,
// 预检可以在不动旧索引的前提下挡掉必然失败的重建。
async function duplicateCheck(tableName, col, err) {
  const sql = `SELECT "${qident(col)}" AS v, COUNT(*) AS n FROM "${qident(tableName)}"` +
    ` WHERE "${qident(col)}" IS NOT NULL GROUP BY "${qident(col)}" HAVING COUNT(*) > 1 LIMIT 1`;
  let r;
  try { r = await api.post('/api/sql', {sql}); }
  catch (e) { err(e.message); return false; }
  if (r.kind === 'error') { err(r.message); return false; }
  if (r.kind === 'rows' && r.rows.length) {
    err(`列 ${col} 存在重复值(如 ${r.rows[0][0]}),无法创建 UNIQUE 索引`);
    return false;
  }
  return true;
}

// def: {name, column, unique};oldName 非空 = 修改模式(按新定义重建)。
function indexDialog(tableName, def, oldName) {
  const editing = !!oldName;
  const m = explorer.tableMeta(tableName);
  const cols = m && m.columns ? m.columns.map(c => c.name) : [];
  if (!cols.length) { ui.toast(`表 ${tableName} 没有声明列,无法管理索引`, true); return; }
  const ov = showModal(`<div class="dialog"><h3>${editing ? '修改索引' : '新建索引'} — ${esc(tableName)}</h3><div class="body">
    <div class="row"><label>索引名</label><input type="text" data-f="name" value="${esc(def.name || '')}" placeholder="如 idx_${esc(def.column || 'col')}"></div>
    <div class="row"><label>列</label><select data-f="col" style="flex:1">${cols.map(c => `<option${c === def.column ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="row"><label>唯一索引</label><label style="display:inline-flex;align-items:center;gap:5px;color:var(--txt);cursor:pointer">
      <input type="checkbox" data-f="uniq"${def.unique ? ' checked' : ''}>UNIQUE(拒绝重复值;NULL 不算重复)</label></div>
    <div class="hint">仅支持单列索引。${editing
      ? '修改按新定义重建:改名时先建新索引再删旧的(建新失败则原索引保持不变);同名修改先校验数据,再以「删旧 → 建新」重建。'
      : 'UNIQUE 索引创建时会校验既有数据,存在重复值将被拒绝。'}</div>
    <div class="err-line" data-err></div></div>
    <div class="foot"><button data-cancel>取消</button><button class="primary" data-ok>${editing ? '重建' : '创建'}</button></div></div>`,
    'input[data-f="name"]');
  const fail = (msg) => { ui.status(editing ? '重建索引失败' : '创建索引失败', 'err'); $('[data-err]', ov).textContent = msg; };
  $('[data-ok]', ov).onclick = async () => {
    const err = (msg) => { $('[data-err]', ov).textContent = msg || ''; };
    const name = $('input[data-f="name"]', ov).value.trim();
    const col = $('select[data-f="col"]', ov).value;
    const uniq = $('[data-f="uniq"]', ov).checked;
    if (!name) return err('请输入索引名');
    if (indexNameTaken(name, tableName) || (!editing || name !== oldName) && indexDef(tableName, name)) {
      return err(`索引名 ${name} 已被占用(索引名为全库命名空间)`);
    }
    try {
      if (!editing) {
        ui.status(`正在创建索引 ${name}…`, 'busy');
        const r = await api.post('/api/sql', {sql: indexCreateSql(tableName, name, col, uniq) + ';'});
        if (r.kind === 'error') return fail(r.message);
        ui.toast(`已创建索引 ${name}(${tableName}.${col})`);
      } else {
        if (name === oldName && col === def.column && uniq === !!def.unique) return err('未修改任何内容');
        if (name !== oldName) {
          // 改名重建:先建新(失败则旧索引原样保留),成功后再删旧。
          ui.status(`正在重建索引 ${oldName} → ${name}…`, 'busy');
          let r = await api.post('/api/sql', {sql: indexCreateSql(tableName, name, col, uniq) + ';'});
          if (r.kind === 'error') return fail(r.message);
          r = await api.post('/api/sql', {sql: `DROP INDEX "${qident(oldName)}";`});
          if (r.kind === 'error') ui.toast(`新索引 ${name} 已创建,但删除旧索引 ${oldName} 失败:${r.message}`, true);
          else ui.toast(`已重建索引 ${oldName} → ${name}`);
        } else {
          // 同名重建:先查重挡掉必然失败,再按「删旧 → 建新」顺序重建。
          if (uniq && !(await duplicateCheck(tableName, col, err))) return;
          ui.status(`正在重建索引 ${name}…`, 'busy');
          const r = await api.post('/api/sql', {sql: `DROP INDEX "${qident(oldName)}";\n${indexCreateSql(tableName, name, col, uniq)};`});
          if (r.kind === 'error') return fail(r.message);
          if (r.kind === 'batch' && r.error) {
            return fail(r.error.statement === 1
              ? `旧索引已删除,但新定义创建失败:${r.error.message}`
              : `删除旧索引失败:${r.error.message}`);
          }
          ui.toast(`已按新定义重建索引 ${name}(${tableName}.${col})`);
        }
      }
      ui.status('');
      explorer.refreshSoon();
      closeModal();
    } catch (e) { fail(e.message); }
  };
  ov.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target.matches('input[type=text]')) $('[data-ok]', ov).click();
  };
}

function newIndexDialog(tableName) {
  const m = explorer.tableMeta(tableName);
  const cols = m && m.columns ? m.columns.map(c => c.name) : [];
  if (!cols.length) { ui.toast(`表 ${tableName} 没有声明列,无法创建索引`, true); return; }
  indexDialog(tableName, {name: '', column: cols[0], unique: false}, null);
}

function editIndexDialog(tableName, indexName) {
  const d = indexDef(tableName, indexName);
  if (!d) { ui.toast('未找到该索引的定义,请刷新对象资源管理器后重试', true); explorer.refreshSoon(); return; }
  indexDialog(tableName, {name: d.name, column: d.column, unique: !!d.unique}, indexName);
}

function dropIndex(tableName, indexName) {
  dialog('删除索引', [{name: 'name', label: '索引名', value: indexName, ph: '输入索引名以确认'}], '删除', async (v, err) => {
    if (v.name !== indexName) { err('索引名不匹配'); throw new Error('cancel'); }
    const r = await api.post('/api/sql', {sql: `DROP INDEX "${qident(indexName)}";`});
    if (r.kind === 'error') { ui.toast(r.message, true); return; }
    ui.toast(`已删除索引 ${indexName}(${tableName})`);
    explorer.refreshSoon();
  });
}

/* ================= 标签页管理 ================= */
const tabs = {
  list: [], active: null, seq: 0,
  open(kind, key, title, build) {
    const found = this.list.find(t => t.kind === kind && t.key === key);
    if (found) { this.activate(found); return found; }
    const t = { id: ++this.seq, kind, key, title };
    const stripEl = document.createElement('div');
    stripEl.className = 'tab';
    stripEl.innerHTML = `<span class="tb-ico" style="display:inline-flex">${ICONS[tabs.kindIcon(kind)]||''}</span><span class="t">${esc(title)}</span><span class="x" title="关闭">×</span>`;
    stripEl.onclick = () => this.activate(t);
    stripEl.onmousedown = (e) => { if (e.button === 1) this.close(t); };
    $('.x', stripEl).onclick = (e) => { e.stopPropagation(); this.close(t); };
    $('#tabstrip').appendChild(stripEl);
    const docEl = document.createElement('div');
    docEl.className = 'doc';
    $('#tabcontent').appendChild(docEl);
    t.stripEl = stripEl; t.el = docEl;
    this.list.push(t);
    build(t);
    this.activate(t);
    return t;
  },
  kindIcon(kind) { return { query: 'query', data: 'table', dash: 'dashboard', cluster: 'cluster', logs: 'log' }[kind] || 'view'; },
  activate(t) {
    this.active = t;
    $$('.tab').forEach(el => el.classList.remove('active'));
    $$('.doc').forEach(el => el.classList.remove('active'));
    t.stripEl.classList.add('active'); t.el.classList.add('active');
    if (t.onActivate) t.onActivate();
  },
  close(t) {
    if (t.onClose) t.onClose();
    t.stripEl.remove(); t.el.remove();
    this.list = this.list.filter(x => x !== t);
    if (this.active === t && this.list.length) this.activate(this.list[this.list.length - 1]);
    else if (!this.list.length) { this.active = null; ui.status(''); }
  },
  byKind(kind) { return this.list.filter(t => t.kind === kind); },
  activeQuery() { return this.active && this.active.kind === 'query' ? this.active : null; }
};

/* ================= SQL 高亮编辑器 ================= */
const KW = ('SELECT FROM WHERE AND OR NOT NULL IS IN LIKE BETWEEN ORDER BY GROUP HAVING LIMIT OFFSET AS ASC DESC ' +
  'INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE ALTER ADD DROP INDEX VIEW PRIMARY KEY UNIQUE AUTOINCREMENT ' +
  'AUTO_INCREMENT INT INTEGER TEXT REAL FLOAT BOOLEAN BOOL GUID UUID UUIDV7 UNIQUEIDENTIFIER ' +
  'BEGIN COMMIT ROLLBACK TRANSACTION JOIN INNER LEFT CROSS ' +
  'ON USING UNION ALL DISTINCT COUNT SUM AVG MIN MAX RETURNING IF EXISTS CASCADE CONSTRAINT CHECK DEFAULT FOREIGN ' +
  'REFERENCES EXPLAIN PRAGMA CASE WHEN THEN ELSE END EXISTS').split(/\s+/);
const FN = ['COUNT','SUM','AVG','MIN','MAX','UPPER','LOWER','LENGTH','ABS','ROUND','COALESCE'];
const KW_RE = new RegExp(`^(?:${KW.join('|')})$`, 'i');

function highlightSQL(src) {
  let out = '';
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${esc(m[3])}</span>`;
    else if (KW_RE.test(m[4])) out += `<span class="k">${esc(m[4])}</span>`;
    else if (FN.includes(m[4].toUpperCase())) out += `<span class="f">${esc(m[4])}</span>`;
    else out += esc(m[4]);
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out + '\n';
}

function makeEditor(container, initial) {
  container.innerHTML = `<div class="editor">
    <div class="gutter"><div class="gutter-in">1</div></div>
    <div class="edit-scroll"><pre class="hl"><code></code></pre>
    <textarea class="src" spellcheck="false" wrap="off"></textarea></div></div>`;
  const ed = $('.editor', container), ta = $('.src', container), code = $('code', container),
        gutterIn = $('.gutter-in', container), hl = $('.hl', container);
  ta.value = initial || '';
  const render = () => {
    code.innerHTML = highlightSQL(ta.value);
    const lines = ta.value.split('\n').length;
    gutterIn.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
  };
  const sync = () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; gutterIn.style.transform = `translateY(${-ta.scrollTop}px)`; };
  ta.addEventListener('input', render);
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2; render(); }
  });
  render();
  return {
    el: ed, ta,
    get value() { return ta.value; },
    set value(v) { ta.value = v; render(); },
    selectedText() { return ta.value.slice(ta.selectionStart, ta.selectionEnd).trim(); },
    focus() { ta.focus(); }
  };
}

/* ================= 结果网格 ================= */
function renderGrid(container, cols, rows, opts) {
  opts = opts || {};
  const state = { sortCol: null, asc: true };
  const wrap = document.createElement('div');
  wrap.className = 'grid-wrap';
  container.appendChild(wrap);
  const draw = () => {
    let data = rows;
    if (state.sortCol !== null) {
      const i = state.sortCol;
      data = rows.slice().sort((a, b) => {
        const x = a[i], y = b[i];
        if (x === null) return 1; if (y === null) return -1;
        if (typeof x === 'number' && typeof y === 'number') return state.asc ? x - y : y - x;
        const c = String(x).localeCompare(String(y));
        return state.asc ? c : -c;
      });
    }
    const head = `<th class="rownum">#</th>` + cols.map((c, i) =>
      `<th data-ci="${i}" title="${esc(c)}">${esc(c)}${state.sortCol === i ? `<span class="sort-ind">${state.asc ? '▲' : '▼'}</span>` : ''}</th>`).join('');
    const body = data.map((row, ri) => `<tr${opts.onRowClick ? ` data-ri="${ri}"` : ''}>` +
      `<td class="rownum">${ri + 1}</td>` +
      row.map(v => `<td title="${v === null ? 'NULL' : esc(v)}">${v === null ? '<span class="null">NULL</span>' : esc(v)}</td>`).join('') + '</tr>').join('');
    wrap.innerHTML = `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    $$('th[data-ci]', wrap).forEach(th => th.onclick = () => {
      const i = +th.dataset.ci;
      if (state.sortCol === i) { if (state.asc) state.asc = false; else { state.sortCol = null; } }
      else { state.sortCol = i; state.asc = true; }
      draw();
    });
    if (opts.onRowClick) $$('tr[data-ri]', wrap).forEach(tr => {
      tr.onclick = () => { $$('tr', wrap).forEach(x => x.classList.remove('sel')); tr.classList.add('sel');
        opts.onRowClick(data[+tr.dataset.ri]); };
    });
  };
  draw();
  return wrap;
}

      </div>
      <div class="q-wrap"><div class="ed-host" style="flex:1.2;display:flex;min-height:90px;flex-direction:column"></div>
      <div class="res-wrap">

          <div class="res-tab active" data-rt="results">结果</div>

    t.showResults = () => { const rt = $('[data-rt="results"]', t.el); if (rt) rt.click(); };
    t.clearOutput = () => {
      $('[data-rp="results"]', t.el).innerHTML = '';
      $('[data-rp="messages"] .msg-list', t.el).innerHTML = '';
    };
    $$('.res-tab', t.el).forEach(tabEl => tabEl.onclick = () => {
      $$('.res-tab', t.el).forEach(x => x.classList.remove('active'));
      $$('.res-pane', t.el).forEach(x => x.classList.remove('active'));
      tabEl.classList.add('active');
      $(`[data-rp="${tabEl.dataset.rt}"]`, t.el).classList.add('active');
    });

    $('[data-do="parse"]', t.el).onclick = () => parseQuery(t);
    $('[data-do="execsel"]', t.el).onclick = () => execQuery(t, true);
    t.onActivate = () => t.editor.focus();
    if (autoRun) execQuery(t);
  });
}

async function execQuery(t, selectedOnly) {
  const sql = (selectedOnly ? t.editor.selectedText() : t.editor.value).trim();
  if (!sql) { ui.toast('没有可执行的 SQL'); return; }
  t.clearOutput();
  ui.status('正在执行查询…', 'busy');
  const t0 = performance.now();
  let data;
  try { data = await api.post('/api/sql', {sql}); }
  catch (e) { t.msg(e.message, 'err'); ui.status('执行失败', 'err'); return; }
  const ms = Math.max(1, Math.round(performance.now() - t0));
  const results = $('[data-rp="results"]', t.el);
  const renderOutcome = (o, idx) => {
    if (o.kind === 'rows') {
      if (idx !== undefined) { const lab = document.createElement('div'); lab.className = 'grid-label';
        lab.textContent = `结果 ${idx + 1}(${o.rows.length} 行)`; results.appendChild(lab); }
      renderGrid(results, o.columns, o.rows);
      t.msg(`(${o.rows.length} 行)` + (idx === undefined ? '' : ` — 结果 ${idx + 1}`), 'info');
    } else if (o.kind === 'affected') {
      t.msg(`(${o.count} 行受影响)`, 'ok');
    } else if (o.kind === 'error') {
      t.msg(`错误:${o.message}`, 'err');
    }
  };
  if (data.kind === 'batch') {
    data.results.forEach((o, i) => renderOutcome(o, data.results.some(x => x.kind === 'rows') ? i : undefined));
    if (data.error) t.msg(`批处理在语句 ${data.error.statement + 1} 处停止:${data.error.message}`, 'err');
    t.msg(`总耗时: ${ms} ms`, 'info');
  } else {
    renderOutcome(data);
    if (data.kind !== 'error') t.msg(`命令已成功完成。总耗时: ${ms} ms`, 'ok');
    else t.msg(`总耗时: ${ms} ms`, 'info');
  }
  const rowCount = data.kind === 'rows' ? data.rows.length :
    data.kind === 'batch' ? data.results.reduce((n, o) => n + (o.rows ? o.rows.length : 0), 0) : 0;
  const hasErr = data.kind === 'error' || (data.kind === 'batch' && data.error);
  if (hasErr) ui.status(`查询完成(有错误)· 耗时 ${ms} ms · ${rowCount} 行`, 'err');
  else ui.status(`查询已成功执行 · 耗时 ${ms} ms · ${rowCount} 行`);
  t.showResults();
}

async function parseQuery(t) {
  const sql = t.editor.value.trim();
  if (!sql) { ui.toast('没有可分析的 SQL'); return; }
  try {
    const r = await api.post('/api/parse', {sql});
    if (r.ok) { t.msg('分析完成: 未检测到语法错误。', 'ok'); ui.toast('分析通过:无语法错误'); }
    else { t.msg('分析失败: ' + r.message, 'err'); ui.toast('分析失败(见消息页)', true); }
  } catch (e) { t.msg(e.message, 'err'); }
}

/* ================= 表数据查看 ================= */
async function dropTable(tableName, after) {
  dialog('删除表', [{name: 'name', label: '表名', value: tableName, ph: '输入表名以确认'}], '删除', async (v, err) => {
    if (v.name !== tableName) { err('表名不匹配'); throw new Error('cancel'); }
    const r = await api.post('/api/sql', {sql: `DROP TABLE "${qident(tableName)}"`});
    if (r.kind === 'error') { ui.toast(r.message, true); return; }
    ui.toast(`已删除表 ${tableName}`);
    explorer.refreshSoon();
    if (after) after();
  });
}

function openDataTab(tableName, meta) {
  tabs.open('data', 'data:' + tableName, `表: ${tableName}`, (t) => {
    t.offset = 0; t.limit = 200; t.selected = null;
    t.el.innerHTML = `<div class="doc-bar">
        <span class="title">${esc(tableName)}</span>
        <button data-do="refresh">刷新</button>
        <button data-do="prev">◀ 上一页</button>
        <button data-do="next">下一页 ▶</button>
        <span class="meta" data-range></span>
        <div class="spacer"></div>
        <button data-do="edit" title="编辑表结构(列编辑网格)">编辑表…</button>
        <button data-do="insert" class="primary" title="插入文档(JSON)">插入文档…</button>
        <button data-do="query">生成查询</button>
        <button data-do="drop" class="danger">删除表…</button>
      </div><div class="res-wrap"><div class="res-pane active grid-host" style="display:block"></div></div>`;
    t.host = $('.grid-host', t.el);
    const range = () => { $('[data-range]', t.el).textContent = t.offset === 0 && t.total === 0 ? '(空表)' : `第 ${t.offset + 1}–${Math.min(t.offset + t.limit, t.total)} 行,共 ${t.total} 行`; };
    t.load = async () => {
      ui.status(`正在加载 ${tableName}…`, 'busy');
      try {
        const count = await api.post('/api/sql', {sql: `SELECT COUNT(*) FROM "${qident(tableName)}"`});
        t.total = count.kind === 'rows' ? +count.rows[0][0] : 0;
        const r = await api.post('/api/sql', {sql: `SELECT * FROM "${qident(tableName)}" ORDER BY 1 LIMIT ${t.limit} OFFSET ${t.offset}`});
        t.host.innerHTML = '';
        if (r.kind === 'error') { t.host.innerHTML = `<div class="msg-list"><div class="m-err">${esc(r.message)}</div></div>`; return; }
        const pk = meta && meta.keys && meta.keys[0];
        renderGrid(t.host, r.columns, r.rows, pk ? {onRowClick: row => { t.selected = row; }} : {});
        range();
        ui.status(`${tableName}:共 ${t.total} 行`);
        $('[data-do="prev"]', t.el).disabled = t.offset <= 0;
        $('[data-do="next"]', t.el).disabled = t.offset + t.limit >= t.total;
      } catch (e) { ui.toast(e.message, true); }
    };
    $('[data-do="refresh"]', t.el).onclick = t.load;
    $('[data-do="prev"]', t.el).onclick = () => { t.offset = Math.max(0, t.offset - t.limit); t.load(); };
    $('[data-do="next"]', t.el).onclick = () => { t.offset += t.limit; t.load(); };
    $('[data-do="edit"]', t.el).onclick = () => editTableDialog(tableName, explorer.tableMeta(tableName) || meta, t.load);
    $('[data-do="insert"]', t.el).onclick = () => insertDocDialog(tableName, meta, t.load);
    $('[data-do="query"]', t.el).onclick = () => openQueryTab(`查询: ${tableName}`, `SELECT * FROM "${qident(tableName)}" LIMIT 200;`, true);
    $('[data-do="drop"]', t.el).onclick = () => dropTable(tableName, () => tabs.close(t));
    t.load();
  });
}
