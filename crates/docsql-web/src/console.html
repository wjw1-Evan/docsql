/* ================= 集群状态 ================= */
function openClusterTab() {
  tabs.open('cluster', 'cluster', '集群状态', (t) => {
    t.auto = true;
    t.el.innerHTML = `<div class="dash">
      <h2>集群状态</h2>
      <div class="sub">DOCSQL_PEERS 对等节点 · 只读探测(PING 存活 + STATUS 状态报告),不影响集群数据</div>
      <div class="dash-actions">
        <button class="primary" data-do="refresh">立即刷新</button>
        <label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--txt2)">
          <input type="checkbox" data-do="auto" checked>每 5 秒自动刷新</label>
        <span class="meta" data-at style="color:var(--txt3)"></span>
      </div>
      <div data-body><div class="msg-list" style="color:var(--txt3)">正在探测节点…</div></div>
    </div>`;
    $('[data-do="refresh"]', t.el).onclick = () => t.load();
    $('[data-do="auto"]', t.el).onchange = (e) => { t.auto = e.target.checked; };
    t.render = (data) => {
      const body = $('[data-body]', t.el);
      const nodes = data.nodes || [];
      if (!nodes.length) {
        body.innerHTML = `<div class="card" style="max-width:600px">
          <div class="v" style="font-size:15px">单机模式</div>
          <div class="k" style="line-height:1.7">未配置集群(DOCSQL_PEERS 为空),控制台管理默认节点${nodes.default ? ` <b>${esc(nodes.default)}</b>` : '(未配置,请在启动参数或 DOCSQL_UPSTREAM 指定)'},
          可在「视图 → 服务器仪表盘」查看其状态。集群部署时为 web 服务设置
          DOCSQL_PEERS(逗号分隔的节点地址,如 node-a:7600,node-b:7600),即可在此监控各节点。</div></div>`;
        return;
      }
      const reachable = nodes.filter(n => n.reachable).length;
      const down = nodes.length - reachable;
      const st = nodes.filter(n => n.status);
      const maxTables = st.reduce((m, n) => Math.max(m, (n.status.totals && n.status.totals.tables) || 0), 0);
      const maxRows = st.reduce((m, n) => Math.max(m, (n.status.totals && n.status.totals.rows) || 0), 0);
      // 收敛信号用行数一致性:各节点 WAL LSN 在 checkpoint/重启后不在同一
      // 基准上,跨节点比较 LSN 会误报分歧。
      const consistent = st.filter(n => (n.status.totals && n.status.totals.rows) === maxRows).length;
      const ro = st.filter(n => n.status.read_only).length;
      const cards = [
        [`${nodes.length}<small> 个</small>`, '配置节点'],
        [`${reachable}<small> / ${nodes.length}</small>`, '在线(可达)'],
        [`${down}<small> 个</small>`, '离线(不可达)', down ? ' style="color:var(--err)"' : ''],
        [`${maxTables}<small> 张</small>`, '集群表数(节点最大值)'],
        [`${maxRows}<small> 行</small>`, '集群总行数(节点最大值)'],
        [`${consistent}<small> / ${st.length}</small>`, '行数一致的节点'],
        [ro ? `${ro}<small> 个</small>` : '无', '只读节点(PROMOTE 可提升)'],
      ];
      let html = `<div class="cards" style="margin-bottom:14px">` + cards.map(c =>
        `<div class="card"><div class="v"${c[2] || ''}>${c[0]}</div><div class="k">${c[1]}</div></div>`).join('') + `</div>`;
      html += `<table class="grid"><thead><tr>
        <th>节点</th><th>状态</th><th>延迟</th><th>只读</th><th>事务中</th><th>表</th><th>行数</th>
        <th>数据 / WAL</th><th title="节点本机 WAL 写入位置;checkpoint 或重启后回绕,不作跨节点比较">WAL LSN</th><th>运行时长</th><th>Peers</th><th>备注</th></tr></thead><tbody>`;
      const dash = '<span class="null">—</span>';
      for (const n of nodes) {
        const s = n.status;
        let state;
        if (!n.reachable) state = '<span style="color:var(--err);font-weight:600">● 离线</span>';
        else if (!s) state = '<span style="color:var(--warn);font-weight:600">● 在线</span>';
        else if (s.read_only) state = '<span style="color:var(--warn);font-weight:600">● 只读</span>';
        else state = '<span style="color:var(--ok);font-weight:600">● 在线</span>';
        html += `<tr>
          <td style="font-family:var(--mono)">${esc(n.addr)}</td>
          <td>${state}</td>
          <td>${n.latency_ms === null || n.latency_ms === undefined ? dash : esc(n.latency_ms.toFixed(1)) + ' ms'}</td>
          <td>${s ? (s.read_only ? '是' : '否') : dash}</td>
          <td>${s ? (s.in_transaction ? '<span style="color:var(--warn)">是</span>' : '否') : dash}</td>
          <td>${s && s.totals ? esc(s.totals.tables) : dash}</td>
          <td>${s && s.totals ? esc(s.totals.rows) : dash}</td>
          <td>${s && s.storage ? fmtBytes(s.storage.db_bytes) + ' / ' + fmtBytes(s.storage.wal_bytes) : dash}</td>
          <td>${s ? esc(s.durable_lsn) : dash}</td>
          <td>${s ? fmtDur(s.uptime_ms) : dash}</td>
          <td>${s ? esc((s.peers || []).length) : dash}</td>
          <td style="max-width:260px" title="${n.error ? esc(n.error) : ''}">${n.error ? esc(n.error) : dash}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      body.innerHTML = html;
    };
    t.load = async () => {
      try {
        const data = await api.get('/api/cluster');
        nodes.sync(data.nodes || []); // 顺带刷新节点切换器的在线状态
        t.render(data);
        $('[data-at]', t.el).textContent = '上次刷新 ' + new Date().toTimeString().slice(0, 8);
      } catch (e) { ui.toast('集群状态刷新失败:' + e.message, true); }
    };
    // 只在 tab 激活时轮询,后台 tab 不产生探测流量。
    t.timer = setInterval(() => { if (t.auto && tabs.active === t) t.load(); }, 5000);
    t.onClose = () => clearInterval(t.timer);
    t.load();
  });
}

/* ================= 日志(数据 / 同步)================== */
// 全部日志:控制台自身提交语句的审计 + 各节点 REQ_LOGS 报告(语句审计 +
// 同步事件),按时间倒序合并展示;支持类别(全部/数据/同步/仅错误)、来源、
// 关键词过滤与 5 秒自动刷新(仅激活时轮询)。
const SYNC_EVENTS = {
  forward: '写扇出', publish: '发布扇出', trim: 'TRIM 扇出',
  promote: 'PROMOTE', join: '节点加入',
};
const fmtTs = (ms) => { const d = new Date(ms), p = (n, w) => String(n).padStart(w || 2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`; };

function openLogsTab() {
  tabs.open('logs', 'logs', '日志', (t) => {
    t.cat = 'all'; t.src = 'all'; t.q = ''; t.limit = 200; t.auto = true;
    t.rows = []; t.offline = [];
    const CATS = [['all', '全部'], ['data', '数据日志'], ['sync', '同步日志'], ['err', '仅错误']];
    t.el.innerHTML = `<div class="doc-bar">
        <span class="title">日志</span>
        <span data-cats>${CATS.map(([id, label]) => `<button class="catbtn${id === 'all' ? ' on' : ''}" data-cat="${id}">${label}</button>`).join('')}</span>
        <select data-do="src" title="日志来源" style="max-width:170px"><option value="all">全部来源</option></select>
        <input type="text" data-do="q" placeholder="过滤:语句 / 错误 / 目标" style="width:160px">
        <select data-do="limit" title="每来源拉取条数"><option value="100">100 条</option><option value="200" selected>200 条</option><option value="500">500 条</option></select>
        <div class="spacer"></div>
        <button class="primary" data-do="refresh">刷新</button>
        <label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--txt2)">
          <input type="checkbox" data-do="auto" checked>5s 自动刷新</label>
      </div>
      <div class="res-wrap"><div class="res-pane active" data-body style="display:block;padding:0"></div></div>`;
    $$('[data-cat]', t.el).forEach(b => b.onclick = () => {
      t.cat = b.dataset.cat;
      $$('[data-cat]', t.el).forEach(x => x.classList.toggle('on', x === b));
      t.render();
    });
    $('[data-do="src"]', t.el).onchange = (e) => { t.src = e.target.value; t.render(); };
    let qTimer;
    $('[data-do="q"]', t.el).oninput = (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { t.q = e.target.value.trim(); t.render(); }, 200);
    };
    $('[data-do="limit"]', t.el).onchange = (e) => { t.limit = +e.target.value; t.load(); };
    $('[data-do="refresh"]', t.el).onclick = () => t.load();
    $('[data-do="auto"]', t.el).onchange = (e) => { t.auto = e.target.checked; };
    t.render = () => {
      const body = $('[data-body]', t.el);
      const counts = { data: 0, sync: 0, err: 0 };
      for (const r of t.rows) { counts[r.cat]++; if (!r.ok) counts.err++; }
      const rows = t.rows.filter(r => {
        if ((t.cat === 'data' || t.cat === 'sync') && r.cat !== t.cat) return false;
        if (t.cat === 'err' && r.ok) return false;
        if (t.src !== 'all' && r.srcKey !== t.src) return false;
        if (t.q) {
          const hay = (r.text + ' ' + (r.error || '') + ' ' + (r.target || '')).toLowerCase();
          if (!hay.includes(t.q.toLowerCase())) return false;
        }
        return true;
      });
      let html = `<div style="padding:5px 10px;color:var(--txt3)">共 ${t.rows.length} 条 · 数据 ${counts.data} · 同步 ${counts.sync} · 错误 ${counts.err}`
        + (t.offline.length ? ` · <span style="color:var(--err)">离线节点 ${t.offline.length} 个(${t.offline.map(n => esc(n.addr)).join(', ')})</span>` : '') + '</div>';
      if (!rows.length) {
        html += '<div class="msg-list" style="color:var(--txt3)">没有匹配的日志条目。「控制台」来源收录本控制台提交的语句审计;集群部署会汇总各节点的语句与同步日志。</div>';
      } else {
        html += `<table class="grid"><thead><tr><th style="width:104px">时间</th><th>来源</th><th>类别</th><th>内容</th><th>结果</th></tr></thead><tbody>`;
        for (const r of rows) {
          const isData = r.cat === 'data';
          const cat = isData
            ? `<span style="color:var(--accent-dk)">数据</span>${r.replicated ? '<span style="font-size:10px;color:#6a4fa3;border:1px solid #ddd0ee;border-radius:6px;padding:0 4px;margin-left:4px;background:#f4effc" title="来自对等节点扇出的复制应用">复制</span>' : ''}`
            : `<span style="color:#4a7a54">同步</span>`;
          const content = isData
            ? esc(r.text)
            : `<b style="font-weight:600">${esc(SYNC_EVENTS[r.event] || r.event)}</b>${r.target ? ` → <span style="font-family:var(--mono)">${esc(r.target)}</span>` : ''}${r.text ? ` · ${esc(r.text)}` : ''}`;
          const result = !r.ok
            ? `<span style="color:var(--err)" title="${esc(r.error || '')}">${esc((r.error || '失败').slice(0, 80))}</span>`
            : isData
              ? `${r.ms != null ? r.ms.toFixed(1) + ' ms' : ''}${r.affected != null ? (r.ms != null ? ' · ' : '') + r.affected + ' 行' : ''}` || '成功'
              : '成功';
          html += `<tr>
            <td style="font-family:var(--mono)">${esc(fmtTs(r.ts))}</td>
            <td>${esc(r.src)}</td>
            <td>${cat}</td>
            <td style="max-width:480px;overflow:hidden;text-overflow:ellipsis" title="${esc(isData ? r.text : (r.event + ' ' + (r.target || '') + ' ' + r.text))}">${content}</td>
            <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${result}</td>
          </tr>`;
        }
        html += '</tbody></table>';
      }
      body.innerHTML = html;
    };
    t.load = async () => {
      try {
        const data = await api.get('/api/logs?limit=' + t.limit);
        const rows = [];
        const pushQuery = (list, src, srcKey) => (list || []).forEach(e => rows.push({
          ts: e.ts_ms, src, srcKey, cat: 'data', text: e.sql || '',
          ok: !e.error, ms: e.ms, affected: e.affected, error: e.error || null,
          replicated: !!e.replicated,
        }));
        pushQuery(data.local && data.local.query, '控制台', 'local');
        const srcSel = $('[data-do="src"]', t.el);
        const opts = ['<option value="all">全部来源</option>', '<option value="local"' + (t.src === 'local' ? ' selected' : '') + '>控制台</option>'];
        for (const n of data.nodes || []) {
          if (!n.reachable || !n.logs) continue;
          const hit = (n.logs.query || []).length + (n.logs.sync || []).length;
          opts.push(`<option value="${esc(n.addr)}"${t.src === n.addr ? ' selected' : ''}>${esc(n.addr)}(${hit})</option>`);
          pushQuery(n.logs.query, n.addr, n.addr);
          (n.logs.sync || []).forEach(e => rows.push({
            ts: e.ts_ms, src: n.addr, srcKey: n.addr, cat: 'sync',
            event: e.event, target: e.target || '', text: e.sql || '',
            ok: e.ok !== false, error: e.detail || null,
          }));
        }
        srcSel.innerHTML = opts.join('');
        if (t.src !== 'all' && !opts.some(o => o.includes(`value="${t.src}"`))) {
          t.src = 'all';
          srcSel.value = 'all';
        }
        rows.sort((a, b) => b.ts - a.ts);
        t.rows = rows;
        t.offline = (data.nodes || []).filter(n => !n.reachable);
        t.render();
      } catch (e) { ui.toast('日志刷新失败:' + e.message, true); }
    };
    // 与集群页同策略:仅在 tab 激活时轮询。
    t.timer = setInterval(() => { if (t.auto && tabs.active === t) t.load(); }, 5000);
    t.onClose = () => clearInterval(t.timer);
    t.load();
  });
}

/* ================= 对象资源管理器 ================= */
const explorer = {
  meta: null, expanded: new Set(['tables']), selPath: null,
  _timer: null,
  async refresh() {
    try {
      const meta = await api.get('/api/meta');
      // 远程节点代理失败(不可达/拒绝认证)走 in-band error,不点亮整页。
      if (meta && meta.error) {
        this.meta = null;
        $('#tree').innerHTML = `<div class="tnode"><span class="twist"></span><span class="tlabel" style="color:var(--err)">${api.node ? `节点 ${esc(api.node)} 不可用:` : ''}${esc(meta.error)}</span></div>`;
        $('#st-server').textContent = api.node ? `节点 ${api.node} · 不可用` : 'DocSQL';
        ui.status('对象资源管理器刷新失败', 'err');
        return;
      }
      this.meta = meta;
      this.render();
      $('#st-server').textContent = `${api.node ? esc(api.node) + ' · ' : ''}DocSQL v${this.meta.server.version} · ${this.meta.totals.tables} 表`;
    } catch (e) { ui.toast('刷新失败:' + e.message, true); }
  },
  refreshSoon() { clearTimeout(this._timer); this._timer = setTimeout(() => this.refresh(), 250); },

  node(path, icon, labelHTML, opts) {
    opts = opts || {};
    const children = opts.children ? `<div class="tchildren${this.expanded.has(path) ? '' : ' collapsed'}" data-ch="${esc(path)}"></div>` : '';
    const twist = opts.children ? `<span class="twist">${this.expanded.has(path) ? '▼' : '▶'}</span>` : '<span class="twist"></span>';
    return `<div class="tnode${this.selPath === path ? ' sel' : ''}" data-path="${esc(path)}" data-kind="${esc(opts.kind || '')}" data-name="${esc(opts.name || '')}" data-more="${esc(opts.more || '')}">
      ${twist}<span class="tico">${icon}</span><span class="tlabel">${labelHTML}</span></div>${children}`;
  },

  render() {
    const m = this.meta;
    if (!m) return;
    const host = api.node || (location.host || 'localhost');
    const branch = [];
    branch.push(['server', ICONS.server, api.node
      ? `<b>${esc(host)}</b> <span class="cnt" title="远程节点 — 控制台经协议代理,写在该节点上执行并按其集群配置扇出">远程节点</span>`
      : `<b>${esc(host)}</b> <span class="cnt">DocSQL v${esc(m.server.version)}</span>`, {}]);

    // 表
    const tablesInner = m.tables.map(t =>
      this.node('table:' + t.name, ICONS.table, `${esc(t.name)} <span class="cnt">(${esc(t.row_count)})</span>`,
        {kind: 'table', name: t.name, more: t.row_count, children: true}));
    branch.push(['tables', ICONS.folder, `表 <span class="cnt">(${esc(m.totals.tables)})</span>`, {kind: 'tables', children: true}]);

    // 系统视图
    branch.push(['sys', ICONS.folder, '系统视图', {kind: 'sys', children: true}]);

    const tree = $('#tree');
    tree.innerHTML = branch.map(([path, icon, label, opts]) => this.node(path, icon, label, opts)).join('');

    // 填充已展开分支
    if (this.expanded.has('tables')) {
      $(`[data-ch="tables"]`, tree).innerHTML = tablesInner.join('') || '<div class="tnode"><span class="twist"></span><span class="tlabel" style="color:#999">(无表)</span></div>';
      m.tables.forEach(t => {
        const p = 'table:' + t.name;
        if (!this.expanded.has(p)) return;
        const cols = t.columns.map(c => {
          const badges = [c.primary_key ? '<span class="badge">PK</span>' : '', c.unique ? '<span class="badge">UQ</span>' : '',
                          !c.nullable ? '<span class="badge">NN</span>' : '', c.autoinc ? '<span class="badge">AI</span>' : ''].join('');
          return this.node('col:' + t.name + '.' + c.name, c.primary_key ? ICONS.key : ICONS.column,
            `${esc(c.name)}${badges}`, {kind: 'column', name: c.name, more: t.name});
        }).join('');
        // 观测列:仅见于数据、未在表定义中声明的顶层字段(schemaless 写入
        // 不会改写列定义)。SELECT * 会返回它们,声明列不会。
        const declared = new Set(t.columns.map(c => c.name));
        const obsCols = (t.observed || []).filter(n => !declared.has(n)).map(n =>
          this.node('col:' + t.name + '.' + n, ICONS.column,
            `<span class="obs-col">${esc(n)}</span><span class="badge obs" title="仅见于数据,未在表定义中声明;SELECT * 会返回它">数据</span>`,
            {kind: 'column', name: n, more: t.name})).join('');
        const obsN = (t.observed || []).length;
        const colLabel = obsN !== t.columns.length ? `声明 ${t.columns.length} / 实测 ${obsN}` : `${t.columns.length}`;
        const defOf = (n) => (t.index_defs || []).find(d => d.name === n);
        const pkCol = (t.columns.find(c => c.primary_key) || {}).name;
        const idxs = t.indexes.length ? t.indexes.map(i => {
          const d = defOf(i);
          // 约束自动索引:随 PRIMARY KEY/UNIQUE 声明创建,只读展示。
          const label = d && d.auto
            ? `${esc(i)} <span class="cnt">(${esc(d.column)})</span>` +
              `<span class="badge${d.column === pkCol ? ' pk' : ''}" title="${d.column === pkCol ? 'PRIMARY KEY' : 'UNIQUE'} 约束自动索引:随表定义创建与维护,不能单独创建、修改或删除">${d.column === pkCol ? 'PK' : 'UQ'}</span>`
            : d
            ? `${esc(i)} <span class="cnt">(${esc(d.column)})</span>${d.unique ? '<span class="badge" title="唯一索引">UQ</span>' : ''}`
            : esc(i);
          return this.node('idx:' + t.name + '.' + i, ICONS.index, label, {kind: 'index', name: i, more: t.name});
        }).join('')
          : '<div class="tnode"><span class="twist"></span><span class="tlabel" style="color:#999">(无索引)</span></div>';
        const keys = t.keys.length ? t.keys.map(kk =>
          this.node('key:' + t.name + '.' + kk, ICONS.key, esc(kk), {kind: 'key', name: kk, more: t.name})).join('')
          : '<div class="tnode"><span class="twist"></span><span class="tlabel" style="color:#999">(无键)</span></div>';
        const el = $(`[data-ch="${CSS.escape(p)}"]`, tree);
        if (el) el.innerHTML =
          this.node(p + '/columns', ICONS.folder, `列 <span class="cnt" title="声明 ${t.columns.length} 列,数据中实测 ${(t.observed || []).length} 个顶层字段">(${colLabel})</span>`, {children: true}) +
          this.node(p + '/indexes', ICONS.folder, `索引 <span class="cnt">(${t.indexes.length})</span>`, {kind: 'indexes', name: t.name, children: true}) +
          this.node(p + '/keys', ICONS.folder, `键 <span class="cnt">(${t.keys.length})</span>`, {children: true});
        const cEl = $(`[data-ch="${CSS.escape(p + '/columns')}"]`, tree); if (cEl) cEl.innerHTML = cols + obsCols;
        const iEl = $(`[data-ch="${CSS.escape(p + '/indexes')}"]`, tree); if (iEl) iEl.innerHTML = idxs;
        const kEl = $(`[data-ch="${CSS.escape(p + '/keys')}"]`, tree); if (kEl) kEl.innerHTML = keys;
      });
    }
    if (this.expanded.has('sys')) {
      const sysViews = [
        ['information_schema.tables', '表清单(名称/页数)'],
        ['information_schema.columns', '列清单(可空性/类型)'],
        ['sqlite_master', 'SQLite 兼容视图'],
      ];
      const el = $('[data-ch="sys"]', tree);
      if (el) el.innerHTML = sysViews.map(([n, d]) =>
        this.node('sys:' + n, ICONS.view, `${esc(n)} <span class="cnt" title="${esc(d)}">—</span>`, {kind: 'sysview', name: n})).join('');
    }
  },

  tableMeta(name) { return this.meta && this.meta.tables.find(t => t.name === name); },

  /* 交互绑定(事件委托) */
  bind() {
    const tree = $('#tree');
    const hasChildren = (node) => node.nextElementSibling && node.nextElementSibling.dataset.ch !== undefined;
    const toggle = (node) => {
      const path = node.dataset.path;
      if (this.expanded.has(path)) this.expanded.delete(path); else this.expanded.add(path);
      this.render();
    };
    tree.addEventListener('click', (e) => {
      const node = e.target.closest('.tnode[data-path]');
      if (!node) return;
      const kind = node.dataset.kind;
      this.selPath = node.dataset.path;
      $$('.tnode').forEach(n => n.classList.remove('sel'));
      node.classList.add('sel');
      // SSMS 语义:单击箭头折叠/展开;单击标签仅选中(双击再触发打开)
      if (e.target.closest('.twist') && hasChildren(node)) toggle(node);
    });
    tree.addEventListener('dblclick', (e) => {
      const node = e.target.closest('.tnode[data-path]');
      if (!node) return;
      const kind = node.dataset.kind, name = node.dataset.name;
      if (kind === 'table') openDataTab(name, explorer.tableMeta(name));
      else if (kind === 'index') {
        const d = indexDef(node.dataset.more, name);
        if (d && d.auto) autoIndexScript(node.dataset.more, name, d);
        else editIndexDialog(node.dataset.more, name);
      }
      else if (kind === 'sysview') openQueryTab(`查询: ${name}`, `SELECT * FROM ${name} LIMIT 100;`, true);
      else if (hasChildren(node)) toggle(node);
    });
    tree.addEventListener('contextmenu', (e) => {
      const node = e.target.closest('.tnode[data-path]');
      if (!node) { ctx.close(); return; }
      e.preventDefault();
      this.selPath = node.dataset.path;
      this.menuFor(node.dataset.kind, node.dataset.name, node.dataset.more, e.clientX, e.clientY);
    });
  },

  menuFor(kind, name, more, x, y) {
    const q = (sql, title) => openQueryTab(title, sql, true);
    if (kind === 'table') {
      const m = this.tableMeta(name);
      const ddl = m ? this.createScript(m) : '';
      ctx.open([
        {id: 'newq', label: '新建查询', kbd: 'Ctrl+N', act: () => openQueryTab(`查询: ${name}`)},
        {id: 'top', label: '选择前 1000 行', act: () => q(`SELECT * FROM "${qident(name)}" LIMIT 1000;`, `查询: ${name}`)},
        {id: 'data', label: '查看数据(编辑前 200 行)', act: () => openDataTab(name, m)},
        {id: 'edittable', label: '编辑表…', act: () => editTableDialog(name, m)},
        {id: 'insertdoc', label: '插入文档…', act: () => insertDocDialog(name, m)},
        {id: 'newidx', label: '新建索引…', act: () => newIndexDialog(name)},
        '-',
        {id: 'creategen', label: '编写表脚本为 CREATE TO →', act: () => openQueryTab(`脚本: ${name}`, ddl)},
        {id: 'dropgen', label: '编写表脚本为 DROP TO →', act: () => openQueryTab(`脚本: ${name}`, `-- 删除表 ${name}\nDROP TABLE IF EXISTS "${qident(name)}";`)},
        '-',
        {id: 'drop', label: `删除表 ${name}…`, act: () => dropTable(name)},
        {id: 'refresh', label: '刷新', act: () => this.refresh()},
      ], x, y);
    } else if (kind === 'index') {
      const tname = more; // 宿主表名
      const d = indexDef(tname, name);
      if (d && d.auto) {
        // 约束自动索引:只读,不提供修改/删除。
        ctx.open([
          {id: 'idxgen', label: '编写索引脚本为 CREATE TO →', act: () => autoIndexScript(tname, name, d)},
          '-',
          {id: 'copy', label: '复制名称', act: () => { navigator.clipboard && navigator.clipboard.writeText(name); ui.toast('已复制:' + name); }},
        ], x, y);
        return;
      }
      ctx.open([
        {id: 'editidx', label: '修改索引…', act: () => editIndexDialog(tname, name)},
        {id: 'dropidx', label: `删除索引 ${name}…`, act: () => dropIndex(tname, name)},
        {id: 'idxgen', label: '编写索引脚本为 CREATE TO →', act: () => {
          const d = indexDef(tname, name);
          openQueryTab(`脚本: ${name}`, d ? indexCreateSql(tname, name, d.column, !!d.unique) + ';' : `-- 未找到索引 ${name} 的定义`);
        }},
        '-',
        {id: 'copy', label: '复制名称', act: () => { navigator.clipboard && navigator.clipboard.writeText(name); ui.toast('已复制:' + name); }},
      ], x, y);
    } else if (kind === 'indexes') {
      ctx.open([
        {id: 'newidx', label: '新建索引…', act: () => newIndexDialog(name)},
        {id: 'refresh', label: '刷新', act: () => this.refresh()},
      ], x, y);
    } else if (kind === 'column' || kind === 'key' || kind === 'sysview') {
      ctx.open([
        {id: 'copy', label: '复制名称', act: () => { navigator.clipboard && navigator.clipboard.writeText(name); ui.toast('已复制:' + name); }},
        ...(kind === 'sysview' ? [{id: 'sel', label: '选择前 100 行', act: () => q(`SELECT * FROM ${name} LIMIT 100;`, `查询: ${name}`)}] : []),
      ], x, y);
    } else if (kind === 'tables') {
      ctx.open([
        {id: 'newtable', label: '新建表…', act: () => newTableDialog()},
        {id: 'newq', label: '新建查询', act: () => openQueryTab()},
        {id: 'refresh', label: '刷新', act: () => this.refresh()},
      ], x, y);
    } else if (kind === 'server') {
      ctx.open([
        {id: 'newtable', label: '新建表…', act: () => newTableDialog()},
        {id: 'dash', label: '服务器仪表盘', act: () => openDashboard()},
        {id: 'cluster', label: '集群状态', act: () => openClusterTab()},
        {id: 'logs', label: '日志', act: () => openLogsTab()},
        {id: 'newq', label: '新建查询', act: () => openQueryTab()},
        {id: 'refresh', label: '刷新', act: () => this.refresh()},
      ], x, y);
    }
  },

  createScript(m) {
    const cols = m.columns.map(c => {
      let s = `  ${c.name} ${c.data_type || 'ANY'}`;
      if (c.primary_key) s += ' PRIMARY KEY';
      if (c.unique) s += ' UNIQUE';
      if (!c.nullable) s += ' NOT NULL';
      if (c.autoinc) s += ' AUTOINCREMENT';
      if (c.default) s += ` DEFAULT ${c.default}`;
      return s;
    }).join(',\n');
    let s = `-- 表 ${m.name}(${m.row_count} 行,${m.pages} 页)\nCREATE TABLE ${m.name} (\n${cols}\n);`;
    // 索引 DDL 用 index_defs 还原列与唯一性(仅名字不足以重建)。
    const defs = m.index_defs || [];
    for (const i of m.indexes) {
      const d = defs.find(x => x.name === i);
      s += `\nCREATE ${d && d.unique ? 'UNIQUE ' : ''}INDEX ${i} ON ${m.name} (${d ? d.column : (m.columns[0] ? m.columns[0].name : '*')});`;
    }
    return s;
  }
};

/* ================= 全局事件 ================= */
function execActive() { const t = tabs.activeQuery(); if (t) execQuery(t); else ui.toast('当前没有查询窗口'); }
function parseActive() { const t = tabs.activeQuery(); if (t) parseQuery(t); }

document.addEventListener('keydown', (e) => {
  const inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'F5') { e.preventDefault(); if (e.ctrlKey) parseActive(); else execActive(); }
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); execActive(); }
  else if (e.key === 'Escape') { ctx.close(); if ($('#overlay').style.display === 'flex') closeModal(); }
  else if (!inField && (e.key === 'n' || e.key === 'N') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openQueryTab(); }
  else if (!inField && (e.key === 'r' || e.key === 'R') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); explorer.refresh(); }
});
// Ctrl+F5 语义:浏览器会拦截部分场景,菜单/按钮同样可达
$('#btn-exec').onclick = execActive;
$('#btn-parse').onclick = parseActive;
$('#btn-newq').onclick = () => openQueryTab();
$('#btn-refresh').onclick = () => explorer.refresh();
$('#exp-newtable').onclick = () => newTableDialog();
$('#exp-collapse').onclick = () => { explorer.expanded.clear(); explorer.render(); };

$('#btn-connect').onclick = async () => {
  api.token = $('#token').value.trim();
  localStorage.setItem('docsql.token', api.token);
  try {
    await api.get('/api/meta');
    ui.toast('连接成功');
    nodes.boot(); // 认证通过后再取一次节点列表(填充切换器)
    explorer.refresh();
  } catch (e) { ui.toast(e.message, true); }
};
$('#token').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#btn-connect').click(); });

/* 菜单栏 */
$$('[data-menu] > span').forEach(sp => {
  sp.onclick = (e) => { e.stopPropagation();
    const menu = sp.parentElement;
    const wasOpen = menu.classList.contains('open');
    $$('[data-menu]').forEach(m => m.classList.remove('open'));
    if (!wasOpen) menu.classList.add('open');
  };
  sp.onmouseenter = () => { if ($$('.menu.open').length) {
    $$('[data-menu]').forEach(m => m.classList.remove('open')); sp.parentElement.classList.add('open'); } };
});
document.addEventListener('click', () => $$('[data-menu]').forEach(m => m.classList.remove('open')));
$$('.menu-drop [data-act]').forEach(item => {
  item.onclick = () => {
    const act = item.dataset.act;
    if (act === 'new-query') openQueryTab();
    else if (act === 'new-table') newTableDialog();
    else if (act === 'close-tab') { if (tabs.active) tabs.close(tabs.active); }
    else if (act === 'refresh') explorer.refresh();
    else if (act === 'dashboard') openDashboard();
    else if (act === 'cluster') openClusterTab();
    else if (act === 'logs') openLogsTab();
    else if (act === 'about') dialog('关于 DocSQL Studio', [
      {name:'a', label: '产品', value: 'DocSQL Studio — 文档数据库管理控制台(SSMS 风格) v1.0'},
    ], '确定', async () => {});
  };
});

/* ================= 启动 ================= */
$('#token').value = api.token;
explorer.bind();
openDashboard();
explorer.refresh();
nodes.boot();
</script>
