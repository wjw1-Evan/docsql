[package]
name = "docsql-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DocSQL network server: SQL protocol + auth + replication"

[dependencies]
sqlparser = "0.62"
docsql-core = { path = "../docsql-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
# TCP keepalive/NODELAY on accepted connections (session survival across
# NAT/firewall idle timeouts).
socket2 = "0.6"
serde.workspace = true
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
# Native TLS for the data plane (DOCSQL_TLS_CERT/KEY listener,
# DOCSQL_TLS_CONNECT outbound dials). ring provider — same crypto backend
# and version pin as the web console's HTTPS listener, no cmake toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
tempfile.workspace = true
# Self-signed certificate generation for the TLS e2e tests (same dev-dep
# shape as the web console's TLS suite) + the async TLS client side.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
