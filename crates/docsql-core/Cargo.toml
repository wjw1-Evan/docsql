[package]
name = "docsql-core"
# 版本单独钉住,不继承 workspace:crate 版本随产品 CHANGELOG 节奏发布到
# crates.io(与 dotnet 包版本对齐),workspace 级 bump 不牵动已发布版本。
version = "0.9.1"
edition.workspace = true
license.workspace = true
description = "DocSQL embedded core: document storage engine + SQL execution"
repository = "https://github.com/wjw1-Evan/docsql"

[dependencies]
thiserror.workspace = true
serde.workspace = true
tempfile.workspace = true
rust_decimal.workspace = true
num-traits.workspace = true
sqlparser = "0.62"
# Column lists on SELECT grants serialize as JSON arrays inside the
# schemaless grant rows (identifiers may contain commas; CSV would lie).
serde_json = "1"


