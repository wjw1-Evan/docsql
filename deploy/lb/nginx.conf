# DocSQL dev 集群四层 stream LB(profile lb):纯 TCP 透传 + 每连接轮询。
# 不感知协议,因此不感知 TLS/token:客户端经 LB 与节点直接完成 TLS 握手
# (L4 透传,配 DOCSQL_TLS_* 数据面无需改这里),token 随帧原样通行。
#
# 注意本机约束:docker.io 不可达,nginx 取自 azurelinux base 仓(mcr 同源,
# 见 lb.Dockerfile)。daemon off + stderr 日志 = compose 日志即 LB 日志。

worker_processes auto;
daemon off;
pid /run/nginx-lb.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    log_format docsql '$remote_addr -> $upstream_addr '
                      'status=$status bytes_sent=$bytes_sent '
                      'session_time=$session_time';
    access_log /dev/stderr docsql;

    upstream docsql {
        # node-a/b/c = compose 服务名(docker DNS,启动时解析)。passive
        # health check:一次失败 dial 计数,max_fails=2 触发后该节点退出
        # 轮询 fail_timeout(10s),到期再试 —— 减实例恢复后无需动配置。
        server node-a:7600 max_fails=2 fail_timeout=10s;
        server node-b:7600 max_fails=2 fail_timeout=10s;
        server node-c:7600 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 7600 so_keepalive=on;
        proxy_pass docsql;
        # 3s = 快速失败拨号(dead node 不拖住新连接的轮询切换);
        # 60s 必须大于客户端单一帧的读预算(默认 connect timeout 15s),
        # 保证长查询/大结果场景 LB 不抢先断链。
        proxy_connect_timeout 3s;
        proxy_timeout 60s;
    }
}
