# Production deployment: CI-published image ghcr.io/wjw1-evan/docsql — no
# local build, auto-restart on failure, bounded logs. Two topologies via
# compose profiles:
#
#   docker compose -f docker-compose.prod.yml --profile single up -d
#   docker compose -f docker-compose.prod.yml --profile cluster up -d
#
# Configure via deploy/.env (see .env.example):
#   DOCSQL_IMAGE_TAG  image tag (default: latest; pin a released version for
#                     reproducible deploys, e.g. v1.0.0)
#   DOCSQL_TOKEN      auth token for the server protocol port AND the web
#                     console/REST API (empty = no auth — loopback only!)
#
#   cp .env.example .env && edit, then pick a profile and up -d.
#
# All published ports default to loopback (127.0.0.1) so an unauthenticated
# deploy is never exposed to the network. To serve externally, replace e.g.
# "127.0.0.1:17601:7600" with "17601:7600" AND set DOCSQL_TOKEN.
#
# Dev vs prod share host ports (17600-17603, 17700, 17710): run only one of
# them at a time and `down -v` before switching.
services:
  # ---- profile: cluster ------------------------------------------------
  # Symmetric cluster: every node is equal — accepts writes and fans each
  # successful write out to its DOCSQL_PEERS (SQL and KV alike). There is no
  # primary/replica role; connect to any node to read and write.
  node-a:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-a
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-b:7600,node-c:7600"
      # The token applies to this node's SQL/KV port too (nodes authenticate
      # to each other automatically during replication fan-out).
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17601:7600"
    volumes:
      - peer-a-data:/data
    networks: [docsql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-a:7600 $${DOCSQL_TOKEN:-} <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  node-b:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-b
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-c:7600"
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17602:7600"
    volumes:
      - peer-b-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-b:7600 $${DOCSQL_TOKEN:-} <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  node-c:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-c
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-b:7600"
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17603:7600"
    volumes:
      - peer-c-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-c:7600 $${DOCSQL_TOKEN:-} <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Web console (embedded engine on its own volume; REST + UI on :7700).
  # Set DOCSQL_TOKEN in .env to require auth for the console and REST API.
  node-web:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-web
    command: ["/data/docsql.db", "0.0.0.0:7700"]
    entrypoint: ["docsql-web"]
    environment:
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17700:7700"
    volumes:
      - web-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- profile: single -------------------------------------------------
  # One standalone database node: no DOCSQL_PEERS, no replication. Own web
  # console on :17710 so both profiles can run side by side.
  node-single:
    profiles: ["single"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-single
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17600:7600"
    volumes:
      - single-data:/data
    networks: [docsql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-single:7600 $${DOCSQL_TOKEN:-} <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  node-web-single:
    profiles: ["single"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-latest}"
    container_name: docsql-prod-web-single
    command: ["/data/docsql.db", "0.0.0.0:7700"]
    entrypoint: ["docsql-web"]
    environment:
      DOCSQL_TOKEN: "${DOCSQL_TOKEN:-}"
    ports:
      - "127.0.0.1:17710:7700"
    volumes:
      - web-single-data:/data
    networks: [docsql]
    depends_on:
      node-single:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  peer-a-data:
  peer-b-data:
  peer-c-data:
  web-data:
  single-data:
  web-single-data:

networks:
  docsql:
