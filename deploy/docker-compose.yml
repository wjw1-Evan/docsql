# Local development deployment: builds the image from source (Dockerfile at
# the repo root, full cargo test gate inside the build) and tags it
# ghcr.io/wjw1-evan/docsql:local. Two topologies via compose profiles:
#
#   docker compose --profile single up -d    # 1 standalone node (:17600) + web (:17710)
#   docker compose --profile cluster up -d   # 3 symmetric peers + web (see below)
#   docker compose --profile single --profile cluster up -d   # both at once
#
# Tear down with the same profile flags: docker compose --profile ... down
# (down -v also works). Data lives in EXTERNAL volumes (fixed docsql-data-*
# names) that compose never removes — rebuilding/redeploying keeps data.
# Wipe data only via ./reset-data.sh (or explicit docker volume rm).
# Set DOCSQL_IMAGE_TAG to run against an existing image instead of building.
#
# Production deployment (CI-published image, no local build) — same two
# profiles:
#   docker compose -f docker-compose.prod.yml --profile single|cluster up -d
services:
  # ---- profile: cluster ------------------------------------------------
  # Symmetric cluster: every node is equal — accepts writes and fans each
  # successful write out to its DOCSQL_PEERS. There is no
  # primary/replica role; connect to any node to read and write.
  node-a:
    profiles: ["cluster"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-a
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-b:7600,node-c:7600"
      # Inter-node credential: fan-out authenticates with it and only
      # cluster-authed connections may send replication frames. Dev value
      # is public on purpose (nothing secret on a loopback dev cluster);
      # production sets its own via docker-compose.prod.yml/.env.
      DOCSQL_CLUSTER_TOKEN: "dev-cluster-secret"
    ports:
      - "127.0.0.1:17601:7600"
    volumes:
      - peer-a-data:/data
    networks: [docsql]
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-a:7600 <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  node-b:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-b
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-c:7600"
      DOCSQL_CLUSTER_TOKEN: "dev-cluster-secret"
    ports:
      - "127.0.0.1:17602:7600"
    volumes:
      - peer-b-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-b:7600 <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  node-c:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-c
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-b:7600"
      DOCSQL_CLUSTER_TOKEN: "dev-cluster-secret"
    ports:
      - "127.0.0.1:17603:7600"
    volumes:
      - peer-c-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-c:7600 <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- profile: join ----------------------------------------------------
  # A fourth data node brought up against a running cluster: being fresh
  # (empty volume), it pulls the cluster's full state automatically
  # (REQ_SYNC bootstrap), registers itself cluster-wide via
  # DOCSQL_ADVERTISE, and from then on takes part in normal fan-out.
  # Start it with: docker compose --profile cluster --profile join up -d
  # Note: a/b/c keep the dynamic registration until they restart — to make
  # node-d a permanent member, also list node-d:7600 in their DOCSQL_PEERS
  # and recreate them (no data is lost, no re-sync happens).
  node-d:
    profiles: ["join"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-d
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-b:7600,node-c:7600"
      DOCSQL_ADVERTISE: "${DOCSQL_ADVERTISE:-node-d:7600}"
      DOCSQL_CLUSTER_TOKEN: "dev-cluster-secret"
    ports:
      - "127.0.0.1:17604:7600"
    volumes:
      - peer-d-data:/data
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-d:7600 <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web console (management tool; REST + UI on :7700). It stores nothing:
  # the first argument is the default managed node — every data operation
  # connects to it (or to an explicitly selected DOCSQL_PEERS node) over
  # the wire protocol, so console-created data lives in the cluster's
  # volumes, never in a side store. DOCSQL_PEERS feeds the cluster-status
  # probes and the node switcher.
  node-web:
    profiles: ["cluster"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-web
    command: ["node-a:7600", "0.0.0.0:7700"]
    entrypoint: ["docsql-web"]
    environment:
      DOCSQL_PEERS: "node-a:7600,node-b:7600,node-c:7600"
    ports:
      - "127.0.0.1:17700:7700"
    networks: [docsql]
    depends_on:
      node-a:
        condition: service_healthy

  # ---- profile: single -------------------------------------------------
  # One standalone database node: no DOCSQL_PEERS, no replication — reads
  # and writes stay local. Its own web console on :17710 so both profiles
  # can run side by side.
  node-single:
    profiles: ["single"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-single
    command: ["/data/docsql.db", "0.0.0.0:7600"]
    ports:
      - "127.0.0.1:17600:7600"
    volumes:
      - single-data:/data
    networks: [docsql]
    healthcheck:
      test: ["CMD-SHELL", "docsql-cli connect node-single:7600 <<< 'exit;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web console for the single node: manages node-single over the wire
  # protocol, so the UI and native-protocol clients on :17600 see the same
  # data. DOCSQL_PEERS powers the cluster-status page (one node).
  node-web-single:
    profiles: ["single"]
    image: "ghcr.io/wjw1-evan/docsql:${DOCSQL_IMAGE_TAG:-local}"
    container_name: docsql-web-single
    command: ["node-single:7600", "0.0.0.0:7700"]
    entrypoint: ["docsql-web"]
    environment:
      DOCSQL_PEERS: "node-single:7600"
    ports:
      - "127.0.0.1:17710:7700"
    networks: [docsql]
    depends_on:
      node-single:
        condition: service_healthy

# External data volumes: created once (`docker volume create docsql-data-*`
# or any `docker compose up` precondition), they survive `down -v` and
# container recreation — releases never lose data. dev and prod compose
# share the same volumes (they share host ports, only one runs at a time).
# ./reset-data.sh removes them; run-tests.sh recreates them per run.
volumes:
  peer-a-data:
    external: true
    name: docsql-data-a
  peer-b-data:
    external: true
    name: docsql-data-b
  peer-c-data:
    external: true
    name: docsql-data-c
  peer-d-data:
    external: true
    name: docsql-data-d
  single-data:
    external: true
    name: docsql-data-single

networks:
  docsql:
