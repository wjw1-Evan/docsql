[workspace]
resolver = "2"
members = [
    "crates/docsql-core",
    "crates/docsql-server",
    "crates/docsql-web",
    "crates/docsql-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
rust_decimal = "1"
num-traits = "0.2"

# Cross-crate inlining for the parse/eval-heavy read path (SQL text to
# rows); costs link time only.
[profile.release]
lto = "thin"
codegen-units = 1
