[workspace]
resolver = "2"
members = [
    "crates/docsql-core",
    "crates/docsql-kv",
    "crates/docsql-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
